      /* =====================================================================
         Vendors
         ===================================================================== */
      let vendorState = { query: '', filter: 'all', sort: { key: 'name', dir: 'asc' } };

      function renderVendors() {
        document.getElementById('page-title').textContent = 'Vendors';
        const rows = Object.keys(VENDORS).map((name) => {
          const v = VENDORS[name];
          const cs = CONTRACTS.filter((c) => c.vendor === name);
          const active = cs.filter((c) => CLOSED_STAGES.indexOf(c.stage) === -1).length;
          const value = cs.reduce((s, c) => s + c.value, 0);
          return Object.assign({ name, contracts: cs, count: cs.length, active, value }, v);
        });

        let filtered = rows;
        if (vendorState.filter !== 'all') filtered = filtered.filter((r) => r.status === vendorState.filter);
        const q = vendorState.query.trim().toLowerCase();
        if (q) filtered = filtered.filter((r) => (r.name + ' ' + r.contact + ' ' + r.location).toLowerCase().indexOf(q) !== -1);

        if (vendorState.sort.key) {
          const dir = vendorState.sort.dir === 'asc' ? 1 : -1;
          filtered.sort((a, b) => {
            const k = vendorState.sort.key;
            let av, bv;
            if (k === 'active' || k === 'value') { av = a[k]; bv = b[k]; }
            else if (k === 'status') { av = VENDOR_STATUS_ORDER.indexOf(a.status); bv = VENDOR_STATUS_ORDER.indexOf(b.status); }
            else { av = (a[k] || '').toString().toLowerCase(); bv = (b[k] || '').toString().toLowerCase(); }
            if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
          });
        }

        const filterChips = ['all'].concat(VENDOR_STATUS_ORDER).map((f) =>
          '<button class="btn btn--secondary btn--sm" data-vfilter="' + f + '"' +
          (vendorState.filter === f ? ' style="border-color:var(--accent-interactive);color:var(--accent-interactive)"' : '') + '>' +
          (f === 'all' ? 'All' : f) + '</button>'
        ).join('');

        const tbody = filtered.length === 0
          ? '<tr class="empty-row"><td colspan="6">No vendors match.</td></tr>'
          : filtered.map((v) =>
              '<tr data-vendor="' + v.name + '">' +
              '<td><strong>' + v.name + '</strong></td>' +
              '<td><span class="badge badge--' + VENDOR_BADGE[v.status] + '">' + v.status + '</span></td>' +
              '<td><span class="cat"><i class="ph ph-' + CATEGORIES[v.category].icon + '"></i>' + v.category + '</span></td>' +
              '<td>' + v.location + '</td>' +
              '<td class="numeric">' + v.active + ' / ' + v.count + '</td>' +
              '<td class="numeric">' + fmtUsd(v.value) + '</td>' +
              '</tr>'
            ).join('');

        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>Vendors</h1>' +
          '<div class="subtitle">Vendor master used by every contract. Procurement maintains.</div></div>' +
          '<button class="btn" data-bu-action="demo-toast" data-msg="New vendor flow not in demo."><i class="ph ph-plus"></i>Add vendor</button>' +
          '</div>' +
          '<div class="table-toolbar">' +
          '<div class="table-search"><i class="ph ph-magnifying-glass"></i>' +
          '<input type="search" id="vendor-search" placeholder="Search vendors" value="' + vendorState.query.replace(/"/g,'&quot;') + '" /></div>' +
          '<div class="btn-row">' + filterChips + '</div>' +
          '</div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th class="sortable" data-vsort="name"><span class="th-inner">Vendor <i class="ph ph-' +
          (vendorState.sort.key === 'name' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '<th class="sortable" data-vsort="status"><span class="th-inner">Status <i class="ph ph-' +
          (vendorState.sort.key === 'status' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '<th class="sortable" data-vsort="category"><span class="th-inner">Category <i class="ph ph-' +
          (vendorState.sort.key === 'category' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '<th class="sortable" data-vsort="location"><span class="th-inner">Location <i class="ph ph-' +
          (vendorState.sort.key === 'location' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '<th class="sortable" data-vsort="active" style="text-align:right"><span class="th-inner" style="flex-direction:row-reverse">Active / All <i class="ph ph-' +
          (vendorState.sort.key === 'active' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '<th class="sortable" data-vsort="value" style="text-align:right"><span class="th-inner" style="flex-direction:row-reverse">Total value <i class="ph ph-' +
          (vendorState.sort.key === 'value' ? (vendorState.sort.dir === 'asc' ? 'caret-up' : 'caret-down') : 'caret-up-down') + '"></i></span></th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';

        document.querySelectorAll('[data-vfilter]').forEach((b) => {
          b.addEventListener('click', () => { vendorState.filter = b.dataset.vfilter; renderVendors(); });
        });
        const vs = document.getElementById('vendor-search');
        vs.addEventListener('input', (e) => {
          vendorState.query = e.target.value; renderVendors();
          setTimeout(() => { const s = document.getElementById('vendor-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 0);
        });
        document.querySelectorAll('[data-vsort]').forEach((th) => {
          th.addEventListener('click', () => {
            const k = th.dataset.vsort;
            vendorState.sort = { key: k, dir: vendorState.sort.key === k && vendorState.sort.dir === 'asc' ? 'desc' : 'asc' };
            renderVendors();
          });
        });
        document.querySelectorAll('tr[data-vendor]').forEach((tr) => {
          tr.addEventListener('click', () => openVendorModal(tr.dataset.vendor));
        });
      }

      function openVendorModal(name) {
        const v = VENDORS[name]; if (!v) return;
        const cs = CONTRACTS.filter((c) => c.vendor === name);
        const slot = document.getElementById('modal-slot');
        slot.innerHTML = '<div class="modal-scrim" data-close-modal="scrim">' +
          '<div class="modal" data-stop="">' +
          '<div class="modal__head"><div class="modal__title">' + name + '</div>' +
          '<button class="icon-btn" data-close-modal="" aria-label="Close"><i class="ph ph-x"></i></button></div>' +
          '<div class="modal__body">' +
          '<div class="vmodal__statusline">' +
          '<span class="badge badge--' + VENDOR_BADGE[v.status] + '">' + v.status + '</span>' +
          '<span class="vmodal__since">Vendor since ' + v.since + '</span>' +
          '</div>' +
          '<p class="vmodal__note">' + v.note + '</p>' +
          '<div class="vmodal__facts">' +
          '<div class="fact"><span class="fact__k">Primary contact</span><span class="fact__v">' + v.contact + '</span></div>' +
          '<div class="fact"><span class="fact__k">Email</span><span class="fact__v" style="font-size:11px">' + v.email + '</span></div>' +
          '<div class="fact"><span class="fact__k">Phone</span><span class="fact__v">' + v.phone + '</span></div>' +
          '<div class="fact"><span class="fact__k">Location</span><span class="fact__v">' + v.location + '</span></div>' +
          '<div class="fact"><span class="fact__k">Primary category</span><span class="fact__v">' + v.category + '</span></div>' +
          '</div>' +
          '<p class="vmodal__sectiontitle">Contracts in Contract Manager (' + cs.length + ')</p>' +
          (cs.length === 0
            ? '<p style="color:var(--text-secondary);text-align:center;padding:var(--space-4)">No contracts on record for this vendor.</p>'
            : cs.map((c) =>
                '<button class="vmodal-contract" data-close-modal="and-nav" data-nav-target="detail/' + c.num + '">' +
                '<span class="vmodal-contract__main">' +
                '<span class="vmodal-contract__title">' + c.title + '</span>' +
                '<span class="vmodal-contract__num">' + c.num + '</span></span>' +
                '<span class="badge badge--' + STAGES[c.stage].badge + '">' + STAGES[c.stage].label + '</span>' +
                '<i class="ph ph-arrow-right"></i>' +
                '</button>'
              ).join('')) +
          '<p class="vmodal__scope"><i class="ph ph-info"></i>Full vendor history, documents, and contacts live in the Vendor Detail screen.</p>' +
          '</div></div></div>';
      }
      window.openVendorModal = openVendorModal;
      function closeModal(e) {
        if (e && e.target && !e.target.classList.contains('modal-scrim')) return;
        document.getElementById('modal-slot').innerHTML = '';
      }
      window.closeModal = closeModal;

      /* =====================================================================
         Bulk upload
         ===================================================================== */
      const BU_CATEGORIES = ['Event','Facilities','IT'];
      const BU_RAW = [
        { title: 'Carbon copier maintenance',      vendor: 'Canon Business Solutions', category: 'Facilities', value: '24000',  start: '2026-08-01', end: '2027-08-01' },
        { title: 'eDiscovery overflow processing', vendor: 'Relativity ODA LLC',       category: 'IT',         value: '88000',  start: '2026-07-15', end: '2027-07-15' },
        { title: 'Summer associate mixer',         vendor: 'Halcyon Events Group',     category: 'Event',      value: 'TBD',    start: '2026-06-20', end: '2026-06-21' },
        { title: 'Endpoint security renewal',      vendor: 'Exterro, Inc.',            category: 'Tech',       value: '142000', start: '2026-09-01', end: '2027-09-01' },
        { title: 'Cloud backup retainer',          vendor: 'Microsoft Corp',           category: 'IT',         value: '67000',  start: '2026-10-01', end: '2027-10-01' },
        { title: '',                               vendor: 'Bright Bean Services',     category: 'Facilities', value: '12000',  start: '2026-07-01', end: '2027-07-01' },
        { title: 'Townhall AV rental',             vendor: 'Lumen Productions',        category: 'Event',      value: '34000',  start: '2026-11-10', end: '2026-10-10' },
        { title: 'Records shredding addendum',     vendor: 'SecureShred Partners',     category: 'Facilities', value: '9000',   start: '2026-08-15', end: '' },
        { title: 'Research platform seats',        vendor: 'Thomson Reuters',          category: 'IT',         value: '210000', start: '2026-09-30', end: '2027-09-30' },
        { title: 'Lobby plant refresh',            vendor: 'Atrium Build',             category: 'Facilites',  value: '4500',   start: '2026-08-05', end: '2027-08-05' },
        { title: 'Managed print toner program',    vendor: 'Canon Business Solutions', category: 'Facilities', value: '15000',  start: '2026-12-01', end: '2027-12-01' },
        { title: 'AI research pilot extension',    vendor: 'Harvey AI, Inc.',          category: 'IT',         value: '$120,000', start: '2026-08-20', end: '2027-08-20' },
      ];
      let buState = { uploaded: false, rows: [], editing: null };
      function buInit() {
        buState.rows = BU_RAW.map((r, i) => ({ id: i, fields: Object.assign({}, r), skipped: false }));
      }
      buInit();
      function buFieldError(key, fields, vSet) {
        const val = fields[key];
        if (key === 'title') return val.trim() ? null : 'Missing title';
        if (key === 'vendor') { if (!val.trim()) return 'Missing vendor'; return vSet.has(val) ? null : 'Unknown vendor'; }
        if (key === 'category') return BU_CATEGORIES.indexOf(val) !== -1 ? null : 'Unknown category';
        if (key === 'value') { const n = Number(String(val).replace(/[$,\s]/g, '')); return (val !== '' && !isNaN(n) && n > 0) ? null : 'Invalid amount'; }
        if (key === 'start' || key === 'end') {
          if (!val) return 'Missing date';
          if (isNaN(new Date(val + 'T00:00:00'))) return 'Invalid date';
          if (key === 'end' && fields.start && val < fields.start) return 'Ends before start';
          return null;
        }
        return null;
      }
      function renderBulk() {
        document.getElementById('page-title').textContent = 'Bulk upload';
        if (!buState.uploaded) {
          document.getElementById('main').innerHTML =
            '<button class="back-link" data-nav="dashboard"><i class="ph ph-arrow-left"></i>Active contracts</button>' +
            '<div class="page-head"><div><h1>Bulk upload</h1>' +
            '<div class="subtitle">Seed Contract Manager from your legacy SpendConnect export. Preview, fix any flagged rows, then commit only the rows that resolve.</div></div></div>' +
            '<div class="dropzone"><i class="ph ph-upload-simple"></i>' +
            '<h2>Drop SpendConnect_export.csv here</h2>' +
            '<p>Or use the button below to simulate an upload of the sample export.</p>' +
            '<button class="btn" data-bu-action="upload"><i class="ph ph-file-arrow-up"></i>Simulate upload</button>' +
            '</div>';
          return;
        }
        const COLS = [
          { key: 'title', label: 'Contract title' },
          { key: 'vendor', label: 'Vendor' },
          { key: 'category', label: 'Category' },
          { key: 'value', label: 'Value' },
          { key: 'start', label: 'Start' },
          { key: 'end', label: 'End' },
        ];
        const vSet = new Set(Object.keys(VENDORS));
        const total = buState.rows.length;
        let withErrors = 0, ready = 0, skipped = 0;
        buState.rows.forEach((r) => {
          if (r.skipped) { skipped++; return; }
          const errs = COLS.reduce((n, c) => n + (buFieldError(c.key, r.fields, vSet) ? 1 : 0), 0);
          if (errs > 0) withErrors++; else ready++;
        });

        function cellHtml(r, col) {
          const err = buFieldError(col.key, r.fields, vSet);
          const isEditing = buState.editing && buState.editing.id === r.id && buState.editing.key === col.key;
          if (isEditing && !r.skipped) {
            if (col.key === 'vendor') {
              return '<td class="bu-cell--editing"><select autofocus data-commit="' + r.id + ',' + col.key + '">' +
                '<option value="">Select...</option>' +
                Object.keys(VENDORS).map((v) => '<option value="' + v + '"' + (v === r.fields[col.key] ? ' selected' : '') + '>' + v + '</option>').join('') +
                '</select></td>';
            }
            if (col.key === 'category') {
              return '<td class="bu-cell--editing"><select autofocus data-commit="' + r.id + ',' + col.key + '">' +
                BU_CATEGORIES.map((c) => '<option value="' + c + '"' + (c === r.fields[col.key] ? ' selected' : '') + '>' + c + '</option>').join('') +
                '</select></td>';
            }
            const t = col.key === 'value' ? 'number' : (col.key === 'start' || col.key === 'end') ? 'date' : 'text';
            return '<td class="bu-cell--editing"><input autofocus type="' + t + '" value="' + (r.fields[col.key] || '').replace(/"/g,'&quot;') + '" data-commit="' + r.id + ',' + col.key + '" /></td>';
          }
          const val = r.fields[col.key];
          let display = val || '—';
          if (col.key === 'value' && val) {
            const n = Number(String(val).replace(/[$,\s]/g, ''));
            display = (!isNaN(n) && n > 0) ? fmtUsd(n) : (val || '—');
          } else if ((col.key === 'start' || col.key === 'end') && val) {
            display = fmtShort(val);
          }
          return '<td class="' + (err ? 'bu-cell--error' : '') + '" data-edit="' + r.id + ',' + col.key + '">' +
            display + (err ? '<span class="bu-err-msg">' + err + '</span>' : '') + '</td>';
        }

        const tbody = buState.rows.map((r) => {
          const errs = COLS.reduce((n, c) => n + (buFieldError(c.key, r.fields, vSet) ? 1 : 0), 0);
          return '<tr class="' + (r.skipped ? 'bu-row--skipped' : '') + '">' +
            COLS.map((c) => cellHtml(r, c)).join('') +
            '<td><button class="btn btn--secondary btn--sm" data-skip="' + r.id + '">' +
            (r.skipped ? 'Restore' : 'Skip') + '</button></td>' +
            '</tr>';
        }).join('');

        document.getElementById('main').innerHTML =
          '<button class="back-link" data-bu-action="reset"><i class="ph ph-arrow-left"></i>Upload a different file</button>' +
          '<div class="page-head"><div><h1>Preview &amp; fix — SpendConnect_export_2026.csv</h1>' +
          '<div class="subtitle">' + total + ' rows parsed. Click any flagged cell to fix it inline, or skip the row.</div></div>' +
          '<div><button class="btn"' + (ready === 0 ? ' disabled' : '') + ' id="commit-btn">' +
          '<i class="ph ph-check"></i>Commit ' + ready + ' row' + (ready === 1 ? '' : 's') + '</button></div>' +
          '</div>' +
          '<div class="bu-stats">' +
          '<div class="bu-stat"><div class="bu-stat__k">Total</div><div class="bu-stat__v">' + total + '</div></div>' +
          '<div class="bu-stat bu-stat--ok"><div class="bu-stat__k">Ready</div><div class="bu-stat__v">' + ready + '</div></div>' +
          '<div class="bu-stat bu-stat--err"><div class="bu-stat__k">With errors</div><div class="bu-stat__v">' + withErrors + '</div></div>' +
          '<div class="bu-stat"><div class="bu-stat__k">Skipped</div><div class="bu-stat__v">' + skipped + '</div></div>' +
          '</div>' +
          '<div class="table-shell"><table class="data-table bu-table"><thead><tr>' +
          COLS.map((c) => '<th>' + c.label + '</th>').join('') +
          '<th>Action</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';

        document.querySelectorAll('[data-edit]').forEach((td) => {
          td.addEventListener('click', () => {
            const [id, key] = td.dataset.edit.split(',');
            buState.editing = { id: +id, key };
            renderBulk();
            setTimeout(() => {
              const el = document.querySelector('[data-commit]');
              if (el) { el.focus(); if (el.select) el.select(); }
            }, 0);
          });
        });
        document.querySelectorAll('[data-commit]').forEach((el) => {
          const commit = () => {
            const [id, key] = el.dataset.commit.split(',');
            const row = buState.rows.find((r) => r.id === +id);
            if (row) row.fields[key] = el.value;
            buState.editing = null; renderBulk();
          };
          el.addEventListener('blur', commit);
          el.addEventListener('change', commit);
          el.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { buState.editing = null; renderBulk(); } });
        });
        document.querySelectorAll('[data-skip]').forEach((b) => {
          b.addEventListener('click', () => {
            const r = buState.rows.find((x) => x.id === +b.dataset.skip);
            if (r) r.skipped = !r.skipped;
            renderBulk();
          });
        });
        const commitBtn = document.getElementById('commit-btn');
        if (commitBtn) commitBtn.addEventListener('click', () => {
          go('dashboard'); showToast(ready + ' row' + (ready === 1 ? '' : 's') + ' committed to Contract Manager.');
          buInit(); buState.uploaded = false;
        });
      }

      /* =====================================================================
         Archive + My submissions
         ===================================================================== */
      function renderArchive() {
        document.getElementById('page-title').textContent = 'Archive';
        const archived = CONTRACTS.filter((c) => ['expired','terminated','canceled','completed'].indexOf(c.stage) !== -1);
        const tbody = archived.length === 0
          ? '<tr class="empty-row"><td colspan="6">No archived contracts.</td></tr>'
          : archived.map((c) => {
              const info = STAGES[c.stage];
              return '<tr data-nav="detail/' + c.num + '">' +
                '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
                '<td>' + c.vendor + '</td>' +
                '<td><span class="cat"><i class="ph ph-' + CATEGORIES[c.category].icon + '"></i>' + c.category + '</span></td>' +
                '<td><span class="badge badge--' + info.badge + '">' + info.label + '</span></td>' +
                '<td class="numeric">' + fmtUsd(c.value) + '</td>' +
                '<td>' + fmtShort(actionDates(c).lastActionISO) + '</td>' +
                '</tr>';
            }).join('');
        document.getElementById('main').innerHTML =
          '<div class="page-head"><div><h1>Archive</h1>' +
          '<div class="subtitle">Completed, expired, canceled, and terminated contracts.</div></div></div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th>Contract</th><th>Vendor</th><th>Category</th><th>Final stage</th>' +
          '<th class="numeric">Value</th><th>Closed</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
      }

      function renderMySubmissions() {
        document.getElementById('page-title').textContent = 'My submissions';
        const mine = CONTRACTS.slice(0, 5);
        const tbody = mine.map((c) => {
          const info = STAGES[c.stage];
          return '<tr data-nav="detail/' + c.num + '">' +
            '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
            '<td><span class="cat"><i class="ph ph-' + CATEGORIES[c.category].icon + '"></i>' + c.category + '</span></td>' +
            '<td><span class="badge badge--' + info.badge + '">' + info.label + '</span></td>' +
            '<td>' + (c.reviewer || '<span class="reviewer--none">Unassigned</span>') + '</td>' +
            '<td class="numeric">' + fmtUsd(c.value) + '</td>' +
            '</tr>';
        }).join('');
        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>My submissions</h1>' +
          '<div class="subtitle">Contracts you\'ve submitted for Procurement review.</div></div>' +
          '<a class="btn" href="#intake"><i class="ph ph-plus"></i>New contract</a></div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th>Contract</th><th>Category</th><th>Stage</th><th>Reviewer</th><th class="numeric">Value</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
      }

      /* =====================================================================
         Theme + toast + dispatch
         ===================================================================== */
      function showToast(msg) {
        const slot = document.getElementById('toast-slot');
        slot.innerHTML = '<div class="toast"><i class="ph ph-check-circle" style="color:var(--color-success);font-size:18px"></i> ' + msg + '</div>';
        setTimeout(() => { slot.innerHTML = ''; }, 4000);
      }
      window.showToast = showToast;

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        document.getElementById('theme-icon').className = next === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
      });

      function dispatch() {
        try {
          const { route, params } = parseHashOrState();
          renderSidebar();
          if (route === 'dashboard') renderDashboard();
          else if (route === 'detail') renderDetail(params[0]);
          else if (route === 'intake') renderIntake();
          else if (route === 'intake-form') renderIntakeForm(params[0] || 'IT');
          else if (route === 'vendors') renderVendors();
          else if (route === 'bulk') renderBulk();
          else if (route === 'archive') renderArchive();
          else if (route === 'my-submissions') renderMySubmissions();
          window.scrollTo(0, 0);
        } catch (err) {
          document.getElementById('main').innerHTML =
            '<div style="padding:24px;background:#FFE2DE;border-left:4px solid #FF3333;color:#000042;border-radius:2px">' +
            '<strong>Demo error.</strong> ' + (err && err.message ? err.message : String(err)) +
            ' <a href="#dashboard" style="margin-left:8px">Back to dashboard</a></div>';
        }
      }

      /* Event delegation — survives sandboxed iframes and re-renders. */
      document.body.addEventListener('click', (e) => {
        // Intercept any <a href="#route"> too, so sidebar/back links work even when
        // hashchange doesn't fire (srcdoc iframes).
        const a = e.target.closest('a[href^="#"]');
        if (a) {
          const route = a.getAttribute('href').slice(1);
          if (route) { e.preventDefault(); go(route); return; }
        }
        const t = e.target.closest('[data-nav],[data-vendor-modal],[data-close-modal],[data-bu-action],[data-stop]');
        if (!t) return;
        if (t.hasAttribute('data-stop')) { e.stopPropagation(); return; }
        if (t.hasAttribute('data-nav')) { go(t.getAttribute('data-nav')); return; }
        if (t.hasAttribute('data-vendor-modal')) { openVendorModal(t.getAttribute('data-vendor-modal')); return; }
        if (t.hasAttribute('data-close-modal')) {
          const mode = t.getAttribute('data-close-modal');
          if (mode === 'scrim' && e.target !== t) return;
          if (mode === 'and-nav') { closeModal(); go(t.getAttribute('data-nav-target')); return; }
          closeModal(); return;
        }
        if (t.hasAttribute('data-bu-action')) {
          const a = t.getAttribute('data-bu-action');
          if (a === 'upload') { buState.uploaded = true; renderBulk(); }
          else if (a === 'reset') { buState.uploaded = false; renderBulk(); }
          else if (a === 'demo-toast') { showToast(t.getAttribute('data-msg') || 'Not in demo.'); }
        }
      });

      window.addEventListener('hashchange', dispatch);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', dispatch);
      } else {
        dispatch();
      }
    </script>
  </body>
</html>
