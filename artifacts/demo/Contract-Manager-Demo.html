<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contract Manager — Phase 1 Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      :root, [data-theme='light'] {
        --color-navy:#000042; --color-blue:#0018f2; --color-white:#fff;
        --color-magenta:#f48dff; --color-orange:#fc561d; --color-gold:#e5ac2e; --color-teal:#00e2c1;

        --accent-interactive:var(--color-blue); --icon-default:var(--color-navy);

      [data-theme='dark'] {

        --text-primary:#fff; --text-secondary:rgba(255,255,255,0.7);

        --focus-ring:var(--color-teal); --scrim:rgba(0,0,0,0.6);

      html { overflow-x:clip; max-width:100vw; scroll-padding-top:80px; }
      *,*::before,*::after { box-sizing:border-box; }
      body { margin:0; font-family:var(--font-sans); background:var(--bg-page);

        max-width:100vw; min-height:100dvh; }
      h1,h2,h3,h4 { font-family:var(--font-mix); font-weight:400; margin:0; line-height:1.15; }

      .btn { display:inline-flex; align-items:center; gap:var(--space-2);

      [data-theme='dark'] .btn { color:var(--color-navy); }

      /* ===== Helpers ===== */
      function fmtUsd(n) { if (n == null) return '—'; return '$' + n.toLocaleString('en-US'); }
      function fmtShort(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { day:'numeric', month:'short' }); }
      function fmtLong(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' }); }
      function todayISO() { return new Date().toISOString().slice(0, 10); }
      function daysFromToday(iso) { if (!iso) return null;
        return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / MS_DAY); }
      function laneDef(id) { return LANE_DEFS.find((l) => l.id === id); }
      function ownerByName(name) { return PROCUREMENT_OWNERS.find((o) => o.name === name); }
      function ownerToneClass(name) { const o = ownerByName(name); return o ? 'owner-' + o.tone : ''; }
      const OPEN_STATUSES = ['in_review','waiting'];
      function isLaneOpen(l) { return OPEN_STATUSES.indexOf(l.status) !== -1; }
      function nextActionDueFromLanes(c) {
        if (c.overallStatus !== 'active') return null;
        let best = null;
        c.lanes.forEach((l) => { if (!isLaneOpen(l) || !l.dueDate) return;
          if (best == null || l.dueDate < best) best = l.dueDate; });
        return best;
      }
      function overallStateLabel(c) {
        if (c.overallStatus === 'completed') return { label:'Completed', badge:'live' };
        if (c.overallStatus === 'canceled') return { label:'Canceled', badge:'failed' };
        const open = c.lanes.filter(isLaneOpen).map((l) => laneDef(l.id) && laneDef(l.id).label).filter(Boolean);
        if (open.length === 0) return { label:'Ready to file', badge:'live' };
        if (open.length === 1) return { label:'With ' + open[0], badge:'pending' };
        return { label:'In review · ' + open.length + ' lanes', badge:'info' };
      }
      function isOverdue(c) {
        if (c.overallStatus !== 'active') return false;
        return c.lanes.some((l) => isLaneOpen(l) && l.dueDate && daysFromToday(l.dueDate) < 0);
      }
      function isDueThisWeek(c) {
        if (c.overallStatus !== 'active') return false;
        const next = nextActionDueFromLanes(c);
        if (next == null) return false;
        const d = daysFromToday(next);
        return d != null && d >= 0 && d <= 7;
      }
      function isWaitingOn(c, laneId) {
        return c.lanes.some((l) => l.id === laneId && (l.status === 'waiting' || l.status === 'in_review'));
      }
      function needsAction(c) {
        if (c.overallStatus !== 'active') return false;
        const proc = c.lanes.find((l) => l.id === 'procurement');
        if (!proc) return false;
        return (proc.status === 'in_review' || proc.status === 'waiting') &&
          (proc.dueDate == null || daysFromToday(proc.dueDate) <= 3);
      }

      /* ===== Routing ===== */
      const ROUTES = ['dashboard','master','detail','intake','intake-form','vendors','archive','my-submissions','bulk','reports','settings'];
      function parseHash() {
        const raw = (location.hash || '#dashboard').slice(1);
        const [route, ...params] = raw.split('/');
        return { route: ROUTES.indexOf(route) !== -1 ? route : 'dashboard', params };
      }
      let currentRoute = null;
      function go(hash) { currentRoute = hash; try { location.hash = hash; } catch (_) {} dispatch(); }
      window.go = go;
      function parseHashOrState() {
        if (currentRoute) { const [route, ...params] = currentRoute.split('/');
          return { route: ROUTES.indexOf(route) !== -1 ? route : 'dashboard', params }; }
        return parseHash();
      }

      function renderSidebar() {

        const items = [

          { route:'archive',        label:'Completed / canceled', icon:'archive-box',  section:'Closed' },
          { route:'settings',       label:'Categories & fields', icon:'gear',          section:'Admin' },
        ];
        let html = '<span class="lockup"><span class="lockup__symbol">' + SYMBOL_SVG +
          '</span><span class="lockup__divider" aria-hidden="true"></span>' +
          '<span class="lockup__name">Contract Manager</span></span><ul class="nav">';
        let lastSection = null;
        for (const item of items) {
          if (item.section !== lastSection) { html += '<li class="nav-section">' + item.section + '</li>'; lastSection = item.section; }
          const isActive = item.route === route ||
            (item.route === 'dashboard' && route === 'detail') ||
            (item.route === 'intake' && route === 'intake-form');
          html += '<li><a class="nav-item ' + (isActive ? 'active' : '') +
            '" href="#' + item.route + '"><i class="ph ph-' + item.icon + '"></i><span>' + item.label + '</span></a></li>';
        }
        html += '</ul><div class="pinned"><div class="avatar" aria-hidden="true">' + ME.initials + '</div>' +

    </script>
    <script>
      /* ===== Dashboard ===== */
      let dashState = { tile:'all', query:'', sort:{ key:'next_due', dir:'asc' }, view:'mine' };
      function activeContracts() { return CONTRACTS.filter((c) => c.overallStatus === 'active'); }
      function filterByView(rows) {
        if (dashState.view === 'mine') return rows.filter((c) => c.owner === ME.name);
        return rows;
      }
      function tileCounts(rows) {
        return {
          all: rows.length,
          action: rows.filter(needsAction).length,
          overdue: rows.filter(isOverdue).length,
          week: rows.filter(isDueThisWeek).length,
          vendor: rows.filter((c) => isWaitingOn(c,'vendor')).length,
          requester: rows.filter((c) => isWaitingOn(c,'requester')).length,
          signature: rows.filter((c) => isWaitingOn(c,'signature')).length,
        };
      }
      function applyTileFilter(rows) {
        switch (dashState.tile) {
          case 'action':    return rows.filter(needsAction);
          case 'overdue':   return rows.filter(isOverdue);
          case 'week':      return rows.filter(isDueThisWeek);
          case 'vendor':    return rows.filter((c) => isWaitingOn(c, 'vendor'));
          case 'requester': return rows.filter((c) => isWaitingOn(c, 'requester'));
          case 'signature': return rows.filter((c) => isWaitingOn(c, 'signature'));
          default:          return rows;
        }
      }
      function sortRows(rows, sort) {
        const dir = sort.dir === 'asc' ? 1 : -1;
        const out = rows.slice();
        out.sort((a, b) => {
          let av, bv;
          if (sort.key === 'title') { av = a.title.toLowerCase(); bv = b.title.toLowerCase(); }
          else if (sort.key === 'vendor') { av = a.vendor.toLowerCase(); bv = b.vendor.toLowerCase(); }
          else if (sort.key === 'requester') { av = (a.requester || '').toLowerCase(); bv = (b.requester || '').toLowerCase(); }
          else if (sort.key === 'owner') { av = (a.owner || '').toLowerCase(); bv = (b.owner || '').toLowerCase(); }
          else if (sort.key === 'category') { av = a.category; bv = b.category; }
          else if (sort.key === 'priority') { const P = { critical:0, high:1, medium:2, low:3 }; av = P[a.priority]; bv = P[b.priority]; }
          else if (sort.key === 'next_due') {
            av = nextActionDueFromLanes(a) || '9999-12-31';
            bv = nextActionDueFromLanes(b) || '9999-12-31';
          } else { av = a.title.toLowerCase(); bv = b.title.toLowerCase(); }
          if (av < bv) return -1 * dir;
          if (av > bv) return 1 * dir;
          return 0;
        });
        return out;
      }
      function sortIcon(key) {
        if (dashState.sort.key !== key) return 'caret-up-down';
        return dashState.sort.dir === 'asc' ? 'caret-up' : 'caret-down';
      }
      function laneSummaryPills(c) {
        const open = c.lanes.filter(isLaneOpen);
        return open.slice(0, 4).map((l) => {
          const def = laneDef(l.id);
          return '<span class="lane-pill lane-pill--' + l.status + '"><span class="lane-pill__dot"></span>' + def.label + '</span>';
        }).join('') + (open.length > 4 ? '<span class="lane-pill lane-pill--not_started">+' + (open.length - 4) + '</span>' : '');
      }
      function nextDueCellHtml(c) {
        const iso = nextActionDueFromLanes(c);
        if (!iso) return '<span class="cell-date">—</span>';
        const d = daysFromToday(iso);
        const overdue = d < 0;
        // Phase 1 open question: priority thresholds for "due soon" vary by contract — Lisa to confirm.
        // Until then, only flag overdue. The earliest open lane date itself is always shown.
        return '<span class="due' + (overdue ? ' due--overdue' : '') + '">' +
          (overdue ? '<i class="ph ph-warning-circle"></i>' : '') + fmtShort(iso) +
          (overdue ? ' (' + (-d) + 'd late)' : '') +
          '</span>';
      }
      function priorityBadge(p) {
        if (p === 'critical') return '<span class="badge badge--priority-critical">Critical</span>';
        if (p === 'high')     return '<span class="badge badge--priority-high">High</span>';
        if (p === 'medium')   return '<span class="badge badge--priority-medium">Medium</span>';
        return '<span class="badge badge--priority-low">Low</span>';
      }
      function renderOwnerLegend() {
        return '<div class="legend" aria-label="Procurement owner color key">' +
          PROCUREMENT_OWNERS.map((o) =>
            '<span class="legend-item"><span class="legend-swatch" style="background:var(--owner-' + o.tone + ')"></span>' +
            o.name + (o.isMe ? ' (you)' : '') + '</span>'
          ).join('') +
          '<span class="legend-item"><span class="legend-swatch" style="background:color-mix(in srgb, var(--color-pale-orange) 60%, transparent)"></span>Overdue lane</span>' +
          '</div>';
      }
      function renderContractTable(rows) {
        const tbody = rows.length === 0
          ? '<tr class="empty-row"><td colspan="9">No contracts match this view.</td></tr>'
          : rows.map((c) => {
              const cat = CATEGORIES[c.category];
              const state = overallStateLabel(c);
              const overdue = isOverdue(c);
              const needs = needsAction(c);
              const isClosed = c.overallStatus !== 'active';
              const cls = [ ownerToneClass(c.owner),
                overdue ? 'is-overdue' : '',
                needs ? 'is-needs-action' : '',
                isClosed ? 'is-closed' : '' ].filter(Boolean).join(' ');
              return '<tr class="' + cls + '" data-nav="detail/' + c.num + '">' +
                '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
                '<td>' + c.vendor + '</td>' +
                '<td>' + c.requester + '</td>' +
                '<td><span class="cell-stack"><span class="owner-dot owner-dot--' + (ownerByName(c.owner) || {tone:1}).tone + '" aria-hidden="true"></span> ' + c.owner + '</span></td>' +
                '<td><span class="cat"><i class="ph ph-' + cat.icon + '"></i>' + c.category + '</span></td>' +
                '<td>' + priorityBadge(c.priority) + '</td>' +
                '<td><span class="badge badge--' + state.badge + '">' + state.label + '</span></td>' +
                '<td><div class="lane-pills">' + laneSummaryPills(c) + '</div></td>' +
                '<td>' + nextDueCellHtml(c) + '</td>' +
                '</tr>';

          '<th class="sortable" data-sort="title"><span class="th-inner">Contract <i class="ph ph-' + sortIcon('title') + '"></i></span></th>' +
          '<th class="sortable" data-sort="vendor"><span class="th-inner">Vendor <i class="ph ph-' + sortIcon('vendor') + '"></i></span></th>' +
          '<th class="sortable" data-sort="requester"><span class="th-inner">Requester <i class="ph ph-' + sortIcon('requester') + '"></i></span></th>' +
          '<th class="sortable" data-sort="owner"><span class="th-inner">Procurement owner <i class="ph ph-' + sortIcon('owner') + '"></i></span></th>' +
          '<th class="sortable" data-sort="category"><span class="th-inner">Category <i class="ph ph-' + sortIcon('category') + '"></i></span></th>' +
          '<th class="sortable" data-sort="priority"><span class="th-inner">Priority <i class="ph ph-' + sortIcon('priority') + '"></i></span></th>' +

          '</div></div>' +
          '<div class="banner"><i class="ph ph-info"></i><span><strong>Phase 1 demo.</strong> Synthetic data. This tool <em>tracks</em> reviews — it does not replace the Tuesday / Thursday risk-review calls where InfoSec, Privacy, GCO, and Legal give approvals verbally. Procurement records the outcomes here.</span></div>' +

          '<div class="table-toolbar">' +
          '<div class="table-search"><i class="ph ph-magnifying-glass"></i>' +
          '<input type="search" id="dash-search" placeholder="Search title, vendor, requester, or owner" value="' + dashState.query.replace(/"/g,'&quot;') + '" /></div>' +
          '<span class="table-meta">' + rows.length + ' of ' + base.length + ' contracts</span>' +

          dashState.query = e.target.value; renderDashboard();
          setTimeout(() => { const s = document.getElementById('dash-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 0);
        });
        document.querySelectorAll('th.sortable').forEach((th) => {

      /* ===== Contract detail ===== */

          : ['Services agreement','Scope of work','Certificate of insurance'];
        return baseDocs.map((name, i) => ({ name, version:'v' + ((i % 3) + 1),
          updated: fmtLong(dayOffsetISO(-(3 + i * 5))), by: i === 0 ? c.owner : 'Lisa Farkas' }));
      }

        return [
          { author:c.requester, role:'Requester', when:'2 days ago', text:'Submitting for review — needs to be in place ahead of the start date.' },
          { author:c.owner, role:'Procurement', when:'1 day ago', text:c.vendor + ' is in active review across multiple lanes. Tracking lane status in the panel above.' },
        ];
      }
      function seedNotes(c) {
        return [
          { type:'Meeting', date:fmtLong(dayOffsetISO(-5)),
            participants:c.owner + ', ' + c.vendor + ', ' + c.requester,
            text:'Kickoff call — walked through scope, terms, and timeline.' },
          { type:'Call', date:fmtLong(dayOffsetISO(-2)),
            participants:c.owner + ', risk review team',
            text:'Internal risk review call. Outcomes recorded per lane.' },

          if (l.status === 'in_review' || l.status === 'approved' || l.status === 'waiting' || l.status === 'complete') {
            events.push({ icon:'arrow-right', text:laneDef(l.id).label + ' lane set to ' + LANE_STATUS[l.status].label, when:fmtLong(l.lastUpdated) });

          tabsHtml +
          '<div class="form-card">' + tabContent + '</div>' +

      }
      function wireDetail(num) {
        const s = detailState[num];
        document.querySelectorAll('.tab').forEach((t) => {
          t.addEventListener('click', () => { s.tab = t.dataset.tab; renderDetail(num); });
        });
        const overall = document.getElementById('overall-select');
        if (overall) overall.addEventListener('change', (e) => {
          s.overallStatus = e.target.value;
          s.activity.unshift({ icon:'flag', text:'Overall status changed to ' + e.target.value, when:'Just now' });
          showToast('Overall status: ' + e.target.value + '.'); renderDetail(num);
        });
        const pri = document.getElementById('priority-select');
        if (pri) pri.addEventListener('change', (e) => {
          s.priority = e.target.value;
          s.activity.unshift({ icon:'flag', text:'Priority changed to ' + e.target.value, when:'Just now' });
          renderDetail(num);
        });
        document.querySelectorAll('[data-act]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const act = btn.dataset.act;
            if (act === 'lane-edit') openLaneEditor(num, +btn.dataset.lane);
            else if (act === 'toggle-lanes') {
              s.lanesExpanded = !s.lanesExpanded;
              renderDetail(num);
            }
            else if (act === 'open-reminder') openReminderModal(num);
            else if (act === 'reopen-contract') {
              s.overallStatus = 'active';
              s.activity.unshift({ icon:'arrow-counter-clockwise', text:'Contract reopened', when:'Just now' });
              showToast('Contract reopened.'); renderDetail(num);
            }
            else if (act === 'attach') {
              s.documents.unshift({ name:'New attachment', version:'v1', updated:'Today', by:ME.name });
              s.activity.unshift({ icon:'paperclip', text:'Document uploaded', when:'Just now' });
              showToast('Document attached.'); renderDetail(num);
            }
            else if (act === 'comment-submit') {
              const t = document.getElementById('comment-input').value.trim();
              if (t) {
                s.comments.push({ author:ME.name, role:'Procurement', when:'Just now', text:t });
                s.activity.unshift({ icon:'chat-text', text:'Comment added by ' + ME.name, when:'Just now' });
                showToast('Comment added.'); renderDetail(num);
              }
            }
            else if (act === 'note-submit') {
              const type = document.getElementById('note-type').value;
              const date = document.getElementById('note-date').value;
              const people = document.getElementById('note-people').value.trim();
              const text = document.getElementById('note-text').value.trim();
              if (text) {
                s.notes.unshift({ type, date:fmtLong(date), participants:people, text });
                s.activity.unshift({ icon:'notepad', text:type + ' note logged', when:'Just now' });
                showToast(type + ' note logged.'); renderDetail(num);
              }
            }
            else if (act === 'reassign') openReassignModal(num);
          });
        });
      }

        document.getElementById('lane-save').addEventListener('click', () => {
          const newStatus = document.getElementById('lane-status').value;
          const oldStatus = lane.status;
          lane.status = newStatus;
          lane.owner = document.getElementById('lane-owner').value || null;
          lane.dueDate = document.getElementById('lane-due').value || null;
          lane.note = document.getElementById('lane-note').value || null;

            s.activity.unshift({ icon:'arrow-right', text:def.label + ' set to ' + LANE_STATUS[newStatus].label, when:'Just now' });

          showToast(def.label + ' updated.'); closeModal(); renderDetail(num);

      function openReminderModal(num) {
        const s = detailState[num];
        const c = CONTRACTS.find((x) => x.num === num);
        // Phase 1: reminders are for external follow-up only. Internal reviewers
        // (Legal, InfoSec, Privacy, GCO) give approvals verbally on the risk-review
        // calls — no in-app pings.
        const reminderTargets = s.lanes.filter((l) => isLaneOpen(l) && (l.id === 'vendor' || l.id === 'requester' || l.id === 'signature'));
        function recipientFor(laneId) {
          if (laneId === 'requester') return requesterEmail(c.requester);
          if (laneId === 'vendor') return c.vendor;
          if (laneId === 'signature') return 'DocuSign envelope';
          return null;
        }

          ? '<p class="notes-empty">No open lanes available for a reminder. Internal reviewers (Legal, InfoSec, Privacy, GCO) are handled on the Tuesday / Thursday risk calls, not via reminders.</p>'

              return '<label style="display:flex; gap:8px; padding:12px; border:1px solid var(--border-light); border-radius:2px; align-items:flex-start; cursor:pointer">' +

          '<div class="modal" data-stop="">' +
          '<div class="modal__head"><div class="modal__title">Send reminder</div>' +
          '<button class="icon-btn" data-close-modal="" aria-label="Close"><i class="ph ph-x"></i></button></div>' +
          '<div class="modal__body">' +
          '<p class="form-helper" style="margin-bottom:12px">External follow-up only — vendor, requester, signature. Internal reviewers are handled on the risk-review calls.</p>' +
          '<div style="display:flex; flex-direction:column; gap:8px">' + optionsHtml + '</div>' +
          '<div class="modal__actions">' +
          '<button class="btn btn--secondary" data-close-modal="">Cancel</button>' +

          const target = document.querySelector('input[name="reminder-target"]:checked').value;

          '<div style="display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap">' +
          '<span class="badge badge--' + VENDOR_BADGE[v.status] + '">' + v.status + '</span>' +
          '<span class="cell-date">Vendor since ' + v.since + '</span></div>' +
          '<p>' + v.note + '</p>' +
          '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px 0; border-top:1px solid var(--border-light); border-bottom:1px solid var(--border-light); margin-bottom:12px">' +
          '<div class="fact"><span class="fact__k">Primary contact</span><span class="fact__v">' + v.contact + '</span></div>' +
          '<div class="fact"><span class="fact__k">Email</span><span class="fact__v" style="font-size:11px">' + v.email + '</span></div>' +
          '<div class="fact"><span class="fact__k">Phone</span><span class="fact__v">' + v.phone + '</span></div>' +
          '<div class="fact"><span class="fact__k">Location</span><span class="fact__v">' + v.location + '</span></div>' +
          '</div>' +
          '<p class="rail-card__eyebrow">Contracts (' + cs.length + ')</p>' +
          cs.map((c) =>
            '<button data-close-modal="and-nav" data-nav-target="detail/' + c.num + '" style="display:flex; align-items:center; gap:12px; width:100%; padding:12px; background:var(--bg-page); border:0; border-radius:2px; margin-bottom:8px; cursor:pointer; font:inherit; color:var(--text-primary); text-align:left">' +
            '<span style="flex:1"><strong>' + c.title + '</strong><br><span class="cell-num">' + c.num + '</span></span>' +
            '<span class="badge badge--' + overallStateLabel(c).badge + '">' + overallStateLabel(c).label + '</span>' +
            '<i class="ph ph-arrow-right"></i></button>').join('') +
          '</div></div></div>';
      }
      window.openVendorModal = openVendorModal;
      function renderArchive() {
        document.getElementById('page-title').textContent = 'Completed / canceled';
        document.getElementById('view-toggle').hidden = true;
        const closed = CONTRACTS.filter((c) => c.overallStatus !== 'active');
        const tbody = closed.length === 0
          ? '<tr class="empty-row"><td colspan="7">No closed contracts yet.</td></tr>'
          : closed.map((c) => {
              const state = overallStateLabel(c);
              return '<tr class="is-closed" data-nav="detail/' + c.num + '">' +
                '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
                '<td>' + c.vendor + '</td>' +
                '<td>' + c.requester + '</td>' +
                '<td>' + c.owner + '</td>' +
                '<td><span class="cat"><i class="ph ph-' + CATEGORIES[c.category].icon + '"></i>' + c.category + '</span></td>' +
                '<td><span class="badge badge--' + state.badge + '">' + state.label + '</span></td>' +
                '<td class="numeric">' + fmtUsd(c.value) + '</td>' +
                '</tr>';
            }).join('');
        document.getElementById('main').innerHTML =
          '<div class="page-head"><div><h1>Completed / canceled</h1>' +
          '<div class="subtitle">Contracts procurement has manually marked complete or canceled. History preserved here — no auto-archive.</div></div></div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th>Contract</th><th>Vendor</th><th>Requester</th><th>Procurement owner</th><th>Category</th><th>Final state</th>' +
          '<th class="numeric">Value</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
      }
      function renderMySubmissions() {
        document.getElementById('page-title').textContent = 'My submissions';
        document.getElementById('view-toggle').hidden = true;
        const mine = CONTRACTS.filter((c) => c.requester === ME.name || c.owner === ME.name);
        const tbody = mine.map((c) => {
          const state = overallStateLabel(c);
          return '<tr data-nav="detail/' + c.num + '" class="' + ownerToneClass(c.owner) + '">' +
            '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
            '<td><span class="cat"><i class="ph ph-' + CATEGORIES[c.category].icon + '"></i>' + c.category + '</span></td>' +
            '<td>' + c.requester + '</td>' +
            '<td><span class="badge badge--' + state.badge + '">' + state.label + '</span></td>' +
            '<td>' + nextDueCellHtml(c) + '</td>' +
            '<td class="numeric">' + fmtUsd(c.value) + '</td>' +
            '</tr>';
        }).join('');
        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>My submissions</h1>' +
          '<div class="subtitle">Contracts where you are the requester or the procurement owner.</div></div>' +
          '<a class="btn" href="#intake"><i class="ph ph-plus"></i>New contract</a></div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th>Contract</th><th>Category</th><th>Requester</th><th>Overall</th><th>Next due</th>' +
          '<th class="numeric">Value</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
      }
      const BU_RAW = [
        { title:'Carbon copier maintenance',     vendor:'Canon Business Solutions', category:'Facilities', value:'24000',  start:'2026-08-01', end:'2027-08-01' },
        { title:'eDiscovery overflow processing',vendor:'Relativity ODA LLC',       category:'IT',         value:'88000',  start:'2026-07-15', end:'2027-07-15' },
        { title:'Summer associate mixer',        vendor:'Halcyon Events Group',     category:'Event',      value:'TBD',    start:'2026-06-20', end:'2026-06-21' },
        { title:'Endpoint security renewal',     vendor:'Exterro, Inc.',            category:'Tech',       value:'142000', start:'2026-09-01', end:'2027-09-01' },
        { title:'Cloud backup retainer',         vendor:'Microsoft Corp',           category:'IT',         value:'67000',  start:'2026-10-01', end:'2027-10-01' },
        { title:'',                              vendor:'Bright Bean Services',     category:'Facilities', value:'12000',  start:'2026-07-01', end:'2027-07-01' },
        { title:'Research platform seats',       vendor:'Thomson Reuters',          category:'IT',         value:'210000', start:'2026-09-30', end:'2027-09-30' },
      ];
      const BU_SOURCES = {
        spreadsheet: {
          label: 'Procurement spreadsheet',
          icon: 'file-xls',
          desc: 'Seed Phase 1 from Lisa\'s current tracking spreadsheet — in-process contracts that need to keep moving.',
          dropTitle: 'Drop your procurement spreadsheet here',
          phase: 'Phase 1 onboarding',
        },
        spendconnect: {
          label: 'SpendConnect export',
          icon: 'database',
          desc: 'Import contract records from a SpendConnect CSV export.',
          dropTitle: 'Drop SpendConnect_export.csv here',
          phase: 'Phase 1',
        },
        repository: {
          label: 'Signed contracts repository',
          icon: 'archive',
          desc: 'Backfill historical signed contracts. Read-only after import — for searchable history.',
          dropTitle: 'Drop a zip / folder of signed PDFs + metadata sheet',
          phase: 'Phase 2 (placeholder)',
        },
        merger: {
          label: 'Merger / acquired-firm import',
          icon: 'arrows-merge',
          desc: 'One-time bulk import of contracts from an acquired firm or practice group.',
          dropTitle: 'Drop the acquired firm\'s export',
          phase: 'Phase 2 (placeholder)',
        },
      };
      let buState = { uploaded:false, source:null };
      function renderBulk() {
        document.getElementById('page-title').textContent = 'Bulk upload';
        document.getElementById('view-toggle').hidden = true;

        if (!buState.source) {
          const cards = Object.keys(BU_SOURCES).map((id) => {
            const s = BU_SOURCES[id];
            return '<button class="category-card" data-bu-action="bu-source" data-source="' + id + '">' +
              '<i class="ph ph-' + s.icon + '"></i>' +
              '<h3>' + s.label + '</h3>' +
              '<p>' + s.desc + '</p>' +
              '<p style="margin-top:var(--space-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);font-weight:600">' + s.phase + '</p>' +
              '</button>';
          }).join('');
          document.getElementById('main').innerHTML =
            '<button class="back-link" data-nav="dashboard"><i class="ph ph-arrow-left"></i>Back to dashboard</button>' +
            '<div class="page-head"><div><h1>Bulk upload</h1>' +
            '<div class="subtitle">Four import paths. Phase 1 priority is the procurement spreadsheet — that\'s how the tool gets seeded with in-process contracts.</div></div></div>' +
            '<div class="category-grid">' + cards + '</div>';
          return;
        }

        const source = BU_SOURCES[buState.source];

        if (!buState.uploaded) {
          document.getElementById('main').innerHTML =
            '<button class="back-link" data-bu-action="reset"><i class="ph ph-arrow-left"></i>Pick a different source</button>' +
            '<div class="page-head"><div>' +
            '<p class="intake-eyebrow"><i class="ph ph-' + source.icon + '"></i>' + source.label + '</p>' +
            '<h1>' + source.dropTitle + '</h1>' +
            '<div class="subtitle">' + source.desc + '</div></div></div>' +
            '<div class="dropzone"><i class="ph ph-upload-simple"></i>' +
            '<h2>Drop your file here</h2>' +
            '<p>Or simulate an upload of a sample.</p>' +
            '<button class="btn" data-bu-action="upload"><i class="ph ph-file-arrow-up"></i>Simulate upload</button>' +
            '</div>';
          return;
        }
        const rows = BU_RAW.length, errors = 3, ready = rows - errors;
        const tbody = BU_RAW.map((r) => {
          const errCat = r.category !== 'Event' && r.category !== 'Facilities' && r.category !== 'IT';
          const errTitle = !r.title;
          const errVal = isNaN(Number(r.value));
          return '<tr>' +
            '<td' + (errTitle ? ' style="background:var(--color-pale-orange)"' : '') + '>' + (r.title || '—') + '</td>' +
            '<td>' + r.vendor + '</td>' +
            '<td' + (errCat ? ' style="background:var(--color-pale-orange)"' : '') + '>' + r.category + '</td>' +
            '<td' + (errVal ? ' style="background:var(--color-pale-orange)"' : '') + '>' + r.value + '</td>' +
            '<td>' + r.start + '</td>' +
            '<td>' + r.end + '</td>' +
            '</tr>';
        }).join('');
        document.getElementById('main').innerHTML =
          '<button class="back-link" data-bu-action="reset"><i class="ph ph-arrow-left"></i>Pick a different source</button>' +
          '<div class="page-head"><div>' +
          '<p class="intake-eyebrow"><i class="ph ph-' + source.icon + '"></i>' + source.label + '</p>' +
          '<h1>Preview &amp; fix</h1>' +
          '<div class="subtitle">' + rows + ' rows parsed. Flagged cells are highlighted.</div></div>' +
          '<div><button class="btn" id="commit-btn"><i class="ph ph-check"></i>Commit ' + ready + ' rows</button></div>' +
          '</div>' +
          '<div class="bu-stats">' +
          '<div class="bu-stat"><div class="bu-stat__k">Total</div><div class="bu-stat__v">' + rows + '</div></div>' +
          '<div class="bu-stat" style="background:var(--color-pale-success)"><div class="bu-stat__k">Ready</div><div class="bu-stat__v">' + ready + '</div></div>' +
          '<div class="bu-stat" style="background:var(--color-pale-orange)"><div class="bu-stat__k">Errors</div><div class="bu-stat__v">' + errors + '</div></div>' +
          '</div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th>Title</th><th>Vendor</th><th>Category</th><th>Value</th><th>Start</th><th>End</th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
        const commitBtn = document.getElementById('commit-btn');
        if (commitBtn) commitBtn.addEventListener('click', () => {
          go('dashboard');
          showToast(ready + ' rows committed from ' + source.label + '.');
          buState.uploaded = false;
          buState.source = null;
        });
      }

      /* ===== Reports ===== */
      function renderReports() {
        document.getElementById('page-title').textContent = 'Reports';
        document.getElementById('view-toggle').hidden = true;
        const all = CONTRACTS;
        const active = all.filter((c) => c.overallStatus === 'active');
        const completed = all.filter((c) => c.overallStatus === 'completed');
        const canceled = all.filter((c) => c.overallStatus === 'canceled');
        const reviewedYTD = completed.length + canceled.length + active.length; // synthetic for demo
        const myActive = active.filter((c) => c.owner === ME.name);
        const myReviewedYTD =
          completed.filter((c) => c.owner === ME.name).length +
          canceled.filter((c) => c.owner === ME.name).length +
          myActive.length;
        const byCat = (rows) => {
          const out = { Event:0, Facilities:0, IT:0 };
          rows.forEach((c) => { out[c.category] = (out[c.category] || 0) + 1; });
          return out;
        };
        const cats = byCat(all);
        const activeCats = byCat(active);
        const byOwner = PROCUREMENT_OWNERS.map((o) => ({
          owner:o, active: active.filter((c) => c.owner === o.name).length,
          completed: completed.filter((c) => c.owner === o.name).length,
        }));

        const kpi = (label, value, sub) =>
          '<div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:var(--space-4);">' +
          '<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);font-weight:600">' + label + '</div>' +
          '<div style="font-family:var(--font-mix);font-size:36px;line-height:1.1;margin-top:6px">' + value + '</div>' +
          (sub ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">' + sub + '</div>' : '') +
          '</div>';

        const bar = (label, value, max) => {
          const pct = max === 0 ? 0 : Math.round((value / max) * 100);
          return '<div style="margin-bottom:var(--space-3)">' +
            '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>' + label + '</span><span style="font-family:var(--font-mono)">' + value + '</span></div>' +
            '<div style="height:8px;background:var(--bg-page);border-radius:var(--radius-pill);overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:var(--accent-interactive);border-radius:var(--radius-pill)"></div>' +
            '</div></div>';
        };

        const maxOwner = Math.max(1, ...byOwner.map((b) => b.active));
        const maxCat   = Math.max(1, ...Object.values(activeCats));

        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>Reports</h1>' +
          '<div class="subtitle">Snapshot for Lisa\'s annual review, leadership rollups (Tenvir, Michael Shea), and rush-request pushback. Synthetic data.</div></div></div>' +
          '<div class="banner"><i class="ph ph-info"></i><span>Phase 1 reports cover counts and current load. Time-to-close and SLA dashboards come in Phase 2.</span></div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%, 200px),1fr));gap:var(--space-3);margin-bottom:var(--space-5)">' +
          kpi('Contracts reviewed YTD', reviewedYTD, 'Across all owners') +
          kpi('My reviewed YTD', myReviewedYTD, ME.name) +
          kpi('Active right now', active.length, '') +
          kpi('My active', myActive.length, ME.name) +
          kpi('Completed YTD', completed.length, '') +
          kpi('Canceled YTD', canceled.length, '') +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-5)" class="reports-grid">' +
          '<div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:var(--space-5)">' +
          '<p class="rail-card__eyebrow">Active by category</p>' +
          bar('Event', activeCats.Event, maxCat) +
          bar('Facilities', activeCats.Facilities, maxCat) +
          bar('IT', activeCats.IT, maxCat) +
          '</div>' +
          '<div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:var(--space-5)">' +
          '<p class="rail-card__eyebrow">Active by procurement owner</p>' +
          byOwner.map((b) => bar(b.owner.name + (b.owner.isMe ? ' (you)' : ''), b.active, maxOwner)).join('') +
          '</div></div>' +
          '<div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:var(--space-5)">' +
          '<p class="rail-card__eyebrow">All-time totals by category</p>' +
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)">' +
          '<div><div class="def__label">Event</div><div style="font-family:var(--font-mix);font-size:28px">' + cats.Event + '</div></div>' +
          '<div><div class="def__label">Facilities</div><div style="font-family:var(--font-mix);font-size:28px">' + cats.Facilities + '</div></div>' +
          '<div><div class="def__label">IT</div><div style="font-family:var(--font-mix);font-size:28px">' + cats.IT + '</div></div>' +
          '</div></div>';
      }

      /* ===== Settings — Categories & fields ===== */
      function renderSettings() {
        document.getElementById('page-title').textContent = 'Categories & fields';
        document.getElementById('view-toggle').hidden = true;
        const cards = Object.keys(CATEGORIES).map((name) => {
          const cat = CATEGORIES[name];
          const fields = (cat.fields || []).map((f) =>
            '<tr><td>' + f.label + '</td><td>' + f.type + '</td><td style="color:var(--text-secondary)">' + (f.helper || '—') + '</td></tr>'
          ).join('');
          return '<div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:var(--space-5);margin-bottom:var(--space-4)">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);flex-wrap:wrap;gap:8px">' +
            '<div style="display:flex;align-items:center;gap:var(--space-2)"><i class="ph ph-' + cat.icon + '" style="font-size:20px"></i>' +
            '<h2 style="font-size:18px;margin:0">' + name + '</h2></div>' +
            '<button class="btn btn--secondary btn--sm" data-bu-action="demo-toast" data-msg="Phase 2: add field editor."><i class="ph ph-plus"></i>Add field</button>' +
            '</div>' +
            '<div class="table-shell"><table class="data-table"><thead><tr>' +
            '<th>Field</th><th>Type</th><th>Helper text</th>' +
            '</tr></thead><tbody>' + fields + '</tbody></table></div></div>';
        }).join('');
        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>Categories & fields</h1>' +
          '<div class="subtitle">Procurement-admin configuration. Phase 1: the schema is data-driven and read-only here. Phase 2 adds the editor.</div></div>' +
          '<button class="btn" data-bu-action="demo-toast" data-msg="Phase 2: add category editor."><i class="ph ph-plus"></i>Add category</button>' +
          '</div>' + cards;
      }

      /* ===== Toast / theme / dispatch ===== */
      function showToast(msg) {
        const slot = document.getElementById('toast-slot');
        slot.innerHTML = '<div class="toast"><i class="ph ph-check-circle" style="color:var(--color-success);font-size:18px"></i> ' + msg + '</div>';
        setTimeout(() => { slot.innerHTML = ''; }, 4000);
      }
      window.showToast = showToast;
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const root = document.documentElement;
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        document.getElementById('theme-icon').className = next === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
      });
      function dispatch() {
        try {
          const { route, params } = parseHashOrState();
          renderSidebar();
          if (route === 'dashboard') { dashState.view = 'mine'; renderDashboard(); }
          else if (route === 'master') { dashState.view = 'master'; renderDashboard(); }
          else if (route === 'detail') renderDetail(params[0]);
          else if (route === 'intake') renderIntake();
          else if (route === 'intake-form') renderIntakeForm(params[0] || 'IT');
          else if (route === 'vendors') renderVendors();
          else if (route === 'bulk') renderBulk();
          else if (route === 'archive') renderArchive();
          else if (route === 'my-submissions') renderMySubmissions();
          else if (route === 'reports') renderReports();
          else if (route === 'settings') renderSettings();
          window.scrollTo(0, 0);
        } catch (err) {
          document.getElementById('main').innerHTML =
            '<div style="padding:24px;background:#FFE2DE;border-left:4px solid #FF3333;color:#000042;border-radius:2px">' +
            '<strong>Demo error.</strong> ' + (err && err.message ? err.message : String(err)) +
            ' <a href="#dashboard" style="margin-left:8px">Back to dashboard</a></div>';
        }
      }
      document.body.addEventListener('click', (e) => {
        const a = e.target.closest('a[href^="#"]');
        if (a) { const route = a.getAttribute('href').slice(1); if (route) { e.preventDefault(); go(route); return; } }
        const t = e.target.closest('[data-nav],[data-vendor-modal],[data-close-modal],[data-bu-action],[data-stop]');
        if (!t) return;
        if (t.hasAttribute('data-stop')) { e.stopPropagation(); return; }
        if (t.hasAttribute('data-nav')) { go(t.getAttribute('data-nav')); return; }
        if (t.hasAttribute('data-vendor-modal')) { openVendorModal(t.getAttribute('data-vendor-modal')); return; }
        if (t.hasAttribute('data-close-modal')) {
          const mode = t.getAttribute('data-close-modal');
          if (mode === 'scrim' && e.target !== t) return;
          if (mode === 'and-nav') { closeModal(); go(t.getAttribute('data-nav-target')); return; }
          closeModal(); return;
        }
        if (t.hasAttribute('data-bu-action')) {
          const a2 = t.getAttribute('data-bu-action');
          if (a2 === 'upload') { buState.uploaded = true; renderBulk(); }
          else if (a2 === 'reset') { buState.uploaded = false; buState.source = null; renderBulk(); }
          else if (a2 === 'demo-toast') { showToast(t.getAttribute('data-msg') || 'Not in this demo.'); }
          else if (a2 === 'bu-source') { buState.source = t.getAttribute('data-source'); renderBulk(); }
        }
      });
      window.addEventListener('hashchange', dispatch);
      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', dispatch); }
      else { dispatch(); }
    </script>
  </body>
</html>
