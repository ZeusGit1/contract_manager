<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contract Manager — Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      /* ========================================================================
         McDermott design tokens
         ======================================================================== */
      :root,
      [data-theme='light'] {
        --color-navy: #000042;
        --color-blue: #0018f2;
        --color-white: #ffffff;
        --color-magenta: #f48dff;
        --color-orange: #fc561d;
        --color-gold: #e5ac2e;
        --color-teal: #00e2c1;
        --color-pale-blue: #e2e8ff;
        --color-pale-magenta: #ffedff;
        --color-pale-orange: #ffe2de;
        --color-pale-gold: #f9e9d2;
        --color-pale-success: #dcf1d2;
        --color-error: #ff3333;
        --color-success: #75d957;
        --color-warning: #f1e53c;
        --bg-page: #f7f7fc;
        --bg-surface: #ffffff;
        --bg-sidebar: var(--color-navy);
        --text-primary: var(--color-navy);
        --text-secondary: rgba(0, 0, 66, 0.65);
        --accent-interactive: var(--color-blue);
        --icon-default: var(--color-navy);
        --border-light: #e5e5ee;
        --border-button: #d9d9d9;
        --focus-ring: var(--color-blue);
        --scrim: rgba(0, 0, 66, 0.5);
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        --font-mix: Georgia, 'Times New Roman', serif;
        --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;
        --space-9: 96px;
        --radius: 2px;
        --radius-pill: 999px;
        --control-h: 40px;
        --control-h-sm: 32px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 66, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 66, 0.08);
        --shadow-lg: 0 12px 32px rgba(0, 0, 66, 0.12);
        --sidebar-w: 260px;
      }
      [data-theme='dark'] {
        --bg-page: #13134e;
        --bg-surface: #1c1c66;
        --bg-sidebar: #0d0d46;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --accent-interactive: var(--color-teal);
        --icon-default: var(--color-teal);
        --border-light: #2c2c80;
        --border-button: #4d4da8;
        --focus-ring: var(--color-teal);
        --scrim: rgba(0, 0, 0, 0.6);
      }
      html { overflow-x: clip; max-width: 100vw; scroll-padding-top: 80px; }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0; font-family: var(--font-sans); background: var(--bg-page);
        color: var(--text-primary); font-size: 14px; line-height: 1.5;
        max-width: 100vw; min-height: 100dvh;
      }
      h1, h2, h3, h4 { font-family: var(--font-mix); font-weight: 400; margin: 0; line-height: 1.15; }
      a { color: var(--accent-interactive); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button { font-family: inherit; font-size: inherit; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100dvh; }

      /* =================== Sidebar =================== */
      .sidebar {
        background: var(--bg-sidebar); color: var(--color-white);
        padding: var(--space-5) 0; display: flex; flex-direction: column;
        position: sticky; top: 0; height: 100dvh; overflow-y: auto;
      }
      .lockup {
        display: inline-flex; align-items: center; gap: var(--space-3);
        padding: 0 var(--space-5); margin-bottom: var(--space-6); min-width: 0;
      }
      .lockup__symbol { width: 32px; height: 32px; flex-shrink: 0; }
      .lockup__symbol svg { width: 100%; height: 100%; fill: currentColor; }
      .lockup__divider {
        width: 1px; align-self: stretch; min-height: 24px; flex-shrink: 0;
        background: color-mix(in srgb, currentColor 22%, transparent);
      }
      .lockup__name { font-family: var(--font-mix); font-size: 18px; line-height: 1.15; }
      .nav-section {
        padding: var(--space-2) var(--space-5); font-size: 11px;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: color-mix(in srgb, currentColor 50%, transparent); margin-top: var(--space-4);
      }
      .nav { list-style: none; margin: 0; padding: 0; flex: 1; }
      .nav-item {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-3) var(--space-5); color: var(--color-white);
        font-family: var(--font-mix); font-size: 16px;
        border-left: 3px solid transparent; text-decoration: none;
      }
      .nav-item i { font-size: 20px; opacity: 0.85; }
      .nav-item:hover {
        background: color-mix(in srgb, currentColor 8%, transparent); text-decoration: none;
      }
      .nav-item.active {
        background: color-mix(in srgb, currentColor 12%, transparent);
        border-left-color: var(--color-teal); font-weight: 600;
      }
      .pinned {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-4) var(--space-5);
        border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: auto;
      }
      .avatar {
        width: 36px; height: 36px; border-radius: var(--radius-pill);
        background: var(--color-teal); color: var(--color-navy);
        font-weight: 600; display: grid; place-items: center; flex-shrink: 0;
      }
      .avatar--sm { width: 28px; height: 28px; font-size: 12px; }
      .user-name { font-size: 13px; }
      .user-role {
        font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em;
      }

      /* =================== Top bar + main =================== */
      .body { display: flex; flex-direction: column; min-width: 0; }
      .topbar {
        position: sticky; top: 0; z-index: 10; height: 56px; background: var(--bg-surface);
        border-bottom: 1px solid var(--border-light);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 var(--space-7);
      }
      .topbar-page { font-family: var(--font-mix); font-size: 18px; }
      .topbar-right { display: flex; align-items: center; gap: var(--space-2); }
      .icon-btn {
        width: 36px; height: 36px; background: transparent; border: 0;
        border-radius: var(--radius); color: var(--icon-default);
        display: grid; place-items: center;
      }
      .icon-btn i { font-size: 20px; }
      .icon-btn:hover { background: var(--border-light); }
      main {
        padding: var(--space-6) var(--space-7); max-width: 1280px;
        width: 100%; margin: 0 auto;
      }

      /* =================== Buttons + badges =================== */
      .btn {
        display: inline-flex; align-items: center; gap: var(--space-2);
        height: var(--control-h); padding: 0 var(--space-5);
        background: var(--accent-interactive); color: var(--color-white);
        border: 0; border-radius: var(--radius); font-size: 13px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
        min-width: 140px; justify-content: center; text-decoration: none;
      }
      [data-theme='dark'] .btn { color: var(--color-navy); }
      .btn:hover { filter: brightness(1.1); text-decoration: none; }
      .btn:disabled { opacity: 0.4; pointer-events: none; }
      .btn--secondary {
        background: transparent; color: var(--text-primary); border: 1px solid var(--border-button);
      }
      .btn--secondary:hover {
        border-color: var(--accent-interactive); color: var(--accent-interactive); filter: none;
      }
      .btn--sm { height: var(--control-h-sm); padding: 0 var(--space-3); font-size: 11px; min-width: 0; }
      .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }

      .badge {
        display: inline-flex; align-items: center; gap: var(--space-1);
        padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.05em; color: var(--color-navy); white-space: nowrap;
      }
      .badge--draft { background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); }
      .badge--info { background: var(--color-pale-blue); }
      .badge--pending { background: var(--color-pale-gold); }
      .badge--live { background: var(--color-pale-success); }
      .badge--failed { background: var(--color-pale-orange); }
      .badge--hold { background: var(--color-pale-magenta); }
      .badge--archived { background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); }

      /* =================== Page head =================== */
      .page-head {
        display: flex; justify-content: space-between; align-items: flex-end;
        margin-bottom: var(--space-5); gap: var(--space-4); flex-wrap: wrap;
      }
      .page-head h1 { font-size: 32px; }
      .page-head .subtitle { color: var(--text-secondary); margin-top: var(--space-2); }
      .page-head__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

      /* =================== Triage strip =================== */
      .triage {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
        gap: var(--space-3); margin-bottom: var(--space-4);
      }
      .triage__chip {
        background: var(--bg-surface); border: 1px solid var(--border-light);
        border-radius: var(--radius); padding: var(--space-3) var(--space-4);
        text-align: left; cursor: pointer; min-width: 0;
        display: flex; flex-direction: column; gap: var(--space-2);
        color: var(--text-primary); font-family: inherit;
      }
      .triage__chip:hover { border-color: var(--accent-interactive); }
      .triage__chip.is-active {
        border-color: var(--accent-interactive);
        box-shadow: inset 0 0 0 1px var(--accent-interactive);
      }
      .triage__top { display: flex; align-items: center; justify-content: space-between; }
      .triage__count { font-family: var(--font-mix); font-size: 28px; line-height: 1; }
      .triage__dot {
        width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--text-secondary);
      }
      .triage__dot--action { background: var(--color-orange); }
      .triage__dot--review { background: var(--color-blue); }
      .triage__dot--sign { background: var(--color-teal); }
      .triage__dot--expiring { background: var(--color-gold); }
      .triage__dot--closed { background: var(--text-secondary); }
      .triage__label {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--text-secondary); font-weight: 600;
      }
      .triage__chip.attention .triage__count { color: var(--color-navy); }

      /* =================== Toolbar + table =================== */
      .table-toolbar {
        display: flex; justify-content: space-between; align-items: center;
        gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap;
      }
      .table-search {
        position: relative; display: flex; align-items: center; flex: 1;
        max-width: 420px; min-width: 220px;
      }
      .table-search i {
        position: absolute; left: var(--space-3); top: 50%;
        transform: translateY(-50%); color: var(--text-secondary); font-size: 16px;
      }
      .table-search input {
        height: var(--control-h-sm); padding: 0 var(--space-3) 0 36px;
        width: 100%; min-width: 0; background: var(--bg-surface);
        border: 1px solid var(--border-light); border-radius: var(--radius);
        font: inherit; color: var(--text-primary);
      }
      .table-meta { font-size: 12px; color: var(--text-secondary); }

      .table-shell {
        background: var(--bg-surface); border: 1px solid var(--border-light);
        border-radius: var(--radius); overflow-x: auto;
      }
      table.data-table { width: 100%; min-width: 980px; border-collapse: collapse; }
      table.data-table th {
        text-align: left; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.05em; font-weight: 600; color: var(--text-secondary);
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--border-light); background: var(--bg-surface);
      }
      table.data-table th.sortable { cursor: pointer; user-select: none; }
      table.data-table th.sortable:hover { color: var(--accent-interactive); }
      .th-inner { display: inline-flex; align-items: center; gap: var(--space-1); }
      .th-inner i { font-size: 14px; opacity: 0.6; }
      table.data-table td {
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--border-light); font-size: 14px;
      }
      table.data-table tbody tr { cursor: pointer; }
      table.data-table tbody tr:hover {
        background: color-mix(in srgb, var(--color-pale-blue) 40%, transparent);
      }
      table.data-table td.numeric { text-align: right; font-family: var(--font-mono); }
      .cell-name { display: flex; flex-direction: column; }
      .cell-num {
        font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono);
      }
      .cell-mono { font-family: var(--font-mono); }
      .cell-date { color: var(--text-secondary); font-size: 13px; }
      .flag-slot { width: 16px; display: inline-block; }
      .flag-dot {
        display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-pill);
        background: var(--color-orange);
      }
      .col-flag { width: 36px; }
      .cat { display: inline-flex; align-items: center; gap: var(--space-1); }
      .cat i { font-size: 14px; color: var(--icon-default); }
      .reviewer__txt { display: flex; flex-direction: column; }
      .reviewer__name { font-size: 14px; }
      .reviewer__team {
        font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
      }
      .reviewer--none { color: var(--text-secondary); font-style: italic; }
      .due { display: inline-flex; align-items: center; gap: var(--space-1); }
      .due--soon { color: var(--color-navy); font-weight: 600; }
      .due--soon i { color: var(--color-orange); font-size: 14px; }
      .empty-row td {
        text-align: center; padding: var(--space-7); color: var(--text-secondary);
      }

      /* =================== Detail page =================== */
      .back-link {
        display: inline-flex; align-items: center; gap: var(--space-2);
        margin-bottom: var(--space-3); color: var(--text-secondary);
        font-size: 13px; background: transparent; border: 0; padding: 0;
      }
      .back-link:hover { color: var(--accent-interactive); }
      .detail-eyebrow {
        display: inline-flex; align-items: center; gap: var(--space-2);
        font-size: 12px; color: var(--text-secondary); margin-bottom: var(--space-1);
      }
      .detail-dot { color: var(--text-secondary); opacity: 0.5; }
      .detail-sub {
        display: inline-flex; align-items: center; gap: var(--space-2);
        flex-wrap: wrap; margin-top: var(--space-3); color: var(--text-secondary);
      }
      .detail-sub .badge { margin-left: var(--space-2); }
      .vendor-link {
        background: transparent; border: 0; padding: 0;
        color: var(--accent-interactive); display: inline-flex;
        align-items: center; gap: 4px; font: inherit; cursor: pointer;
      }
      .vendor-link:hover { text-decoration: underline; }
      .advance-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
      .advance-hint {
        font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
      }

      /* Stepper */
      .workflow {
        background: var(--bg-surface); border: 1px solid var(--border-light);
        border-radius: var(--radius); padding: var(--space-5); margin-bottom: var(--space-4);
      }
      .workflow__eyebrow {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--text-secondary); margin: 0 0 var(--space-4); font-weight: 600;
      }
      .stepper { display: flex; align-items: flex-start; gap: 0; flex-wrap: nowrap; overflow-x: auto; }
      .stepper--muted { opacity: 0.5; }
      .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); position: relative; min-width: 70px; }
      .step__circle {
        width: 28px; height: 28px; border-radius: var(--radius-pill);
        border: 1.5px solid var(--border-light); background: transparent;
        display: grid; place-items: center; font-family: var(--font-sans);
        font-size: 12px; font-weight: 600; color: var(--text-secondary);
        flex-shrink: 0; z-index: 2; background: var(--bg-surface);
      }
      .step.current .step__circle, .step.done .step__circle {
        background: var(--accent-interactive); color: var(--color-white);
        border-color: var(--accent-interactive);
      }
      [data-theme='dark'] .step.current .step__circle,
      [data-theme='dark'] .step.done .step__circle { color: var(--color-navy); }
      .step:not(:last-child)::after {
        content: ''; position: absolute; top: 14px; left: 50%; right: -50%;
        height: 1px; background: var(--border-light); z-index: 1;
      }
      .step.done:not(:last-child)::after { background: var(--accent-interactive); height: 2px; top: 13px; }
      .step__label {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--text-secondary); text-align: center;
      }
      .step.current .step__label { color: var(--text-primary); font-weight: 600; }
      .step.done .step__label { color: var(--text-primary); }
      .workflow-flag {
        margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
        background: var(--color-pale-magenta); color: var(--color-navy);
        border-radius: var(--radius); display: flex; align-items: center;
        gap: var(--space-2); font-size: 13px;
      }
      .workflow-flag--closed { background: var(--color-pale-orange); }
      .workflow-flag__label { font-weight: 600; }

      /* Alert */
      .alert {
        margin-bottom: var(--space-4); padding: var(--space-3) var(--space-4);
        border-radius: var(--radius); display: flex; align-items: flex-start;
        gap: var(--space-3); color: var(--color-navy);
      }
      .alert--info { background: var(--color-pale-blue); border-left: 4px solid var(--color-blue); }
      .alert--warning { background: var(--color-pale-gold); border-left: 4px solid var(--color-gold); }
      .alert--error { background: var(--color-pale-orange); border-left: 4px solid var(--color-error); }
      .alert i { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
      .alert__title { font-weight: 600; }
      .alert__body { font-size: 13px; }

      /* Approvals */
      .approvals {
        background: var(--bg-surface); border: 1px solid var(--border-light);
        border-radius: var(--radius); padding: var(--space-5); margin-bottom: var(--space-4);
      }
      .approvals__head {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: var(--space-4); gap: var(--space-3); flex-wrap: wrap;
      }
      .approvals__title { font-size: 16px; font-weight: 600; margin: 0; }
      .approvals__progress {
        display: inline-flex; align-items: center; gap: var(--space-1);
        font-size: 12px; color: var(--text-secondary);
      }
      .approvals__progress i { color: var(--color-success); font-size: 16px; }
      .approval {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-3) 0; border-top: 1px solid var(--border-light);
        flex-wrap: wrap;
      }
      .approval__team { font-weight: 600; min-width: 80px; }
      .approval__meta { font-size: 12px; color: var(--text-secondary); }
      .approval__spacer { flex: 1; }
      .approval__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

      /* Detail grid */
      .detail-grid {
        display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 320px);
        gap: var(--space-5);
      }
      @media (max-width: 1024px) {
        .detail-grid { grid-template-columns: 1fr; }
      }

      /* Tabs */
      .tabs {
        display: flex; gap: var(--space-5); border-bottom: 1px solid var(--border-light);
        margin: var(--space-5) 0 var(--space-4); overflow-x: auto;
      }
      .tab {
        background: transparent; border: 0; border-bottom: 2px solid transparent;
        padding: var(--space-3) 0; color: var(--text-secondary); font-size: 13px;
        text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
        white-space: nowrap; flex-shrink: 0;
      }
      .tab.active { color: var(--text-primary); border-bottom-color: var(--accent-interactive); }
      .tab:hover { color: var(--accent-interactive); }

      /* Details fields */
      .def-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4) var(--space-5);
      }
      @media (max-width: 640px) { .def-grid { grid-template-columns: 1fr; } }
      .def--full { grid-column: 1 / -1; }
      .def__label {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--text-secondary); font-weight: 600; margin-bottom: var(--space-1);
      }
      .def__value { font-size: 14px; word-break: break-word; }
      .def__desc { margin: 0; font-size: 14px; color: var(--text-primary); }
      .risk-row {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4);
        padding: var(--space-3) 0;
      }
      @media (max-width: 640px) { .risk-row { grid-template-columns: 1fr; } }
      .yn {
        display: inline-flex; align-items: center; gap: var(--space-1);
        font-size: 13px; font-weight: 600;
      }
      .yn--yes { color: var(--color-navy); }
      .yn--yes i { color: var(--color-orange); }
      .yn--no { color: var(--text-secondary); }

      /* Documents */
      .section-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: var(--space-3); gap: var(--space-3); flex-wrap: wrap;
      }
      .section-bar h2 { font-size: 18px; }

      /* =====================================================================

      function fmtUsd(n) { if (n == null) return '—'; return '$' + n.toLocaleString('en-US'); }
      function fmtShort(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short' }); }
      function fmtLong(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); }
      const MS_DAY = 86400000;
      function todayISO() { return new Date().toISOString().slice(0, 10); }
      function parseAgo(s) {
        const m = /(\d+)\s*(m|h|d|w)/.exec(s || ''); if (!m) return new Date();
        const n = +m[1]; const mult = m[2] === 'm' ? 60000 : m[2] === 'h' ? 3600000 : m[2] === 'd' ? MS_DAY : 7*MS_DAY;
        return new Date(Date.now() - n * mult);
      }
      function actionDates(c) {
        const now = new Date();
        const seed = parseInt(c.num.slice(-3), 10) || 1;

        let nextDueISO = null;
        if (c.stage === 'canceled' || c.stage === 'terminated') { nextDueISO = null; }
        else if (c.stage === 'completed' && c.expiresDays != null) {
          nextDueISO = new Date(now.getTime() + (c.expiresDays - 60) * MS_DAY).toISOString().slice(0,10);

          nextDueISO = new Date(now.getTime() + 3 * MS_DAY).toISOString().slice(0,10);

          const nextDays = c.attention ? -2 : (4 + (seed % 8));
          nextDueISO = new Date(now.getTime() + nextDays * MS_DAY).toISOString().slice(0,10);
        }
        return { lastActionISO, nextDueISO };
      }
      function daysFromToday(iso) {
        if (!iso) return null;
        return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / MS_DAY);
      }
      function expiresCellHtml(days, stage) {
        if (stage === 'expired' || (days != null && days < 0)) {

        const reqDate = new Date(now.getTime() - (25 + (seed % 70)) * MS_DAY)

        const r = c.reviewer, t = c.team;
        const comments = [];

          comments.push({ author: requester, role: 'Requester', when: '2 days ago', text: "Submitting for review — we'd like this in place before the current term lapses." });
        } else if (c.stage === 'with_vendor') {

        } else if (c.stage === 'with_requestor') {

          comments.push({ author: r || 'Review team', role: t || 'Review', when: '1 day ago', text: 'Reviewing the terms now. Flagged the liability cap and the data-handling clause for the vendor to address.' });
          comments.push({ author: 'Lisa Farkas', role: 'Procurement', when: '4 hours ago', text: c.vendor + ' is on our preferred list, so let’s prioritize turnaround on this one.' });
        } else if (c.stage === 'out_for_signature') {
          comments.push({ author: r || 'Review team', role: t || 'Review', when: '2 days ago', text: 'Redlines accepted. No outstanding concerns from ' + (t || 'the review team') + '.' });
          comments.push({ author: 'Lisa Farkas', role: 'Procurement', when: '1 day ago', text: 'Signature packet sent to ' + c.vendor + '. Awaiting countersignature.' });
        } else if (c.stage === 'completed') {
          comments.push({ author: 'Lisa Farkas', role: 'Procurement', when: '1 week ago', text: 'Executed and active. Renewal reminder scheduled for 60 days before expiry.' });

        } else if (c.stage === 'expired') {

        }

        function stageEvent(id) {
          switch (id) {
            case 'in_process': return { icon: 'file-plus', text: 'Contract created by ' + requester };
            case 'with_vendor': return { icon: 'paper-plane-tilt', text: 'Sent to ' + c.vendor + ' for redlines' };

            case 'with_legal': return { icon: 'scales', text: 'Routed to Legal for review' };
            case 'with_gco': return { icon: 'gavel', text: 'Routed to GCO for review' };
            case 'with_infosec': return { icon: 'shield-check', text: 'Routed to InfoSec for review' };
            case 'with_privacy': return { icon: 'lock', text: 'Routed to Privacy for review' };
            case 'out_for_signature': return { icon: 'signature', text: 'Signature packet sent to ' + c.vendor };
            case 'completed': return { icon: 'check-circle', text: 'Fully executed — contract completed' };
            default: return { icon: 'circle', text: id };
          }
        }
        const EXC_EV = {
          on_hold: { icon: 'pause', text: 'Placed on hold' },
          canceled: { icon: 'x-circle', text: 'Contract canceled' },
          expired: { icon: 'clock-countdown', text: 'Term lapsed — contract expired' },
          terminated: { icon: 'prohibit', text: 'Contract terminated' },
        };
        const whens = ['Today','Yesterday','4 days ago','1 week ago','2 weeks ago','3 weeks ago','1 month ago','5 weeks ago','6 weeks ago','2 months ago'];
        let activity;
        if (isException) {
          activity = [EXC_EV[c.stage], stageEvent('in_process')];
        } else {

        }
        activity = activity.map((e, i) => Object.assign({}, e, { when: whens[Math.min(i, whens.length - 1)] }));
        if (c.attention && c.action) activity.unshift({ icon: 'bell', text: c.action, when: 'Today' });

        const teams = []; const addTeam = (x) => { if (x && teams.indexOf(x) === -1) teams.push(x); };

          });

        if (REVIEW_STAGES.indexOf(c.stage) !== -1 || ['out_for_signature','completed'].indexOf(c.stage) !== -1) {

            type: 'Call',
            date: new Date(now.getTime() - (3 + (seed % 4)) * MS_DAY).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }),
            participants: 'Lisa Farkas, ' + leadName,
            text: 'Internal sync on outstanding redlines. Agreed to push the indemnification language back to the vendor before routing for signature.',

          sign: CONTRACTS.filter((c) => c.stage === 'out_for_signature').length,
          expiring: CONTRACTS.filter(isExpiring).length,
          closed: CONTRACTS.filter((c) => EXCEPTION_STAGES.indexOf(c.stage) !== -1).length,
        };

        const chips = [
          { id: 'all', label: 'All active', count: counts.all, dot: null },
          { id: 'action', label: 'Needs your action', count: counts.action, dot: 'action' },
          { id: 'review', label: 'In attorney review', count: counts.review, dot: 'review' },
          { id: 'sign', label: 'Awaiting signature', count: counts.sign, dot: 'sign' },
          { id: 'expiring', label: 'Expiring ≤ 14 days', count: counts.expiring, dot: 'expiring' },
          { id: 'closed', label: 'On hold & closed', count: counts.closed, dot: 'closed' },
        ];

        const triageHtml = chips.map((c) =>
          '<button class="triage__chip' + (c.dot === 'action' ? ' attention' : '') +
          (dashState.filter === c.id ? ' is-active' : '') + '" data-filter="' + c.id + '">' +
          '<div class="triage__top"><span class="triage__count">' + c.count + '</span>' +
          (c.dot ? '<span class="triage__dot triage__dot--' + c.dot + '"></span>' : '') +
          '</div><span class="triage__label">' + c.label + '</span></button>'
        ).join('');

        let rows = CONTRACTS.slice();
        if (dashState.filter === 'action') rows = rows.filter((c) => c.attention);
        else if (dashState.filter === 'review') rows = rows.filter((c) => REVIEW_STAGES.indexOf(c.stage) !== -1);
        else if (dashState.filter === 'sign') rows = rows.filter((c) => c.stage === 'out_for_signature');
        else if (dashState.filter === 'expiring') rows = rows.filter(isExpiring);
        else if (dashState.filter === 'closed') rows = rows.filter((c) => EXCEPTION_STAGES.indexOf(c.stage) !== -1);

        const q = dashState.query.trim().toLowerCase();
        if (q) rows = rows.filter((c) => (c.title + ' ' + c.vendor + ' ' + c.num).toLowerCase().indexOf(q) !== -1);

        const dateMap = {};
        CONTRACTS.forEach((c) => { dateMap[c.num] = actionDates(c); });

        if (dashState.sort.key !== 'default') {
          const STAGE_RANK = {}; STAGE_ORDER.forEach((id, i) => { STAGE_RANK[id] = i; });
          EXCEPTION_STAGES.forEach((id, i) => { STAGE_RANK[id] = STAGE_ORDER.length + i; });
          const dir = dashState.sort.dir === 'asc' ? 1 : -1;
          rows.sort((a, b) => {
            let av, bv;
            const k = dashState.sort.key;
            if (k === 'value') { av = a.value; bv = b.value; }
            else if (k === 'expires') { av = a.expiresDays == null ? Infinity : a.expiresDays; bv = b.expiresDays == null ? Infinity : b.expiresDays; }
            else if (k === 'stage') { av = STAGE_RANK[a.stage]; bv = STAGE_RANK[b.stage]; }
            else if (k === 'lastAction') { av = dateMap[a.num].lastActionISO || ''; bv = dateMap[b.num].lastActionISO || ''; }
            else if (k === 'nextDue') { av = dateMap[a.num].nextDueISO || '9999-12-31'; bv = dateMap[b.num].nextDueISO || '9999-12-31'; }
            else if (k === 'reviewer') { av = (a.reviewer || '￿').toLowerCase(); bv = (b.reviewer || '￿').toLowerCase(); }
            else { av = (a[k] || '').toLowerCase(); bv = (b[k] || '').toLowerCase(); }
            if (av < bv) return -1 * dir;
            if (av > bv) return 1 * dir;
            return 0;
          });
        }

        function sortIcon(key) {
          if (dashState.sort.key !== key) return 'caret-up-down';
          return dashState.sort.dir === 'asc' ? 'caret-up' : 'caret-down';
        }

        const tbody = rows.length === 0
          ? '<tr class="empty-row"><td colspan="10">No contracts match this view. Clear the filter or search to see all active contracts.</td></tr>'
          : rows.map((c) => {
              const info = STAGES[c.stage];
              const cat = CATEGORIES[c.category];
              return '<tr data-nav="detail/' + c.num + '">' +
                '<td class="col-flag"><span class="flag-slot">' +
                (c.attention ? '<span class="flag-dot" aria-label="Needs attention"></span>' : '') +
                '</span></td>' +
                '<td><span class="cell-name">' + c.title + '<span class="cell-num">' + c.num + '</span></span></td>' +
                '<td>' + c.vendor + '</td>' +
                '<td><span class="cat"><i class="ph ph-' + cat.icon + '"></i>' + c.category + '</span></td>' +
                '<td><span class="badge badge--' + info.badge + '">' + info.label + '</span></td>' +
                '<td>' + (c.reviewer
                  ? '<span class="reviewer__txt"><span class="reviewer__name">' + c.reviewer + '</span><span class="reviewer__team">' + c.team + '</span></span>'
                  : '<span class="reviewer--none">Unassigned</span>') + '</td>' +
                '<td class="numeric">' + fmtUsd(c.value) + '</td>' +
                '<td>' + expiresCellHtml(c.expiresDays, c.stage) + '</td>' +
                '<td><span class="cell-date">' + fmtShort(dateMap[c.num].lastActionISO) + '</span></td>' +
                '<td>' + nextDueCellHtml(dateMap[c.num].nextDueISO, c.stage) + '</td>' +
                '</tr>';
            }).join('');

        document.getElementById('main').innerHTML =
          '<div class="page-head">' +
          '<div><h1>Active contracts</h1>' +
          '<div class="subtitle">' + dateStr + ' · everything in flight across Event, Facilities, and IT.</div></div>' +
          '<div class="page-head__actions">' +
          '<a class="btn btn--secondary" href="#bulk"><i class="ph ph-upload-simple"></i>Bulk upload</a>' +
          '<a class="btn" href="#intake"><i class="ph ph-plus"></i>New contract</a>' +
          '</div></div>' +
          '<div class="banner"><i class="ph ph-info"></i><span><strong>Demo mode.</strong> Data is synthetic — no real client information. Click any row to open the contract.</span></div>' +
          '<div class="triage" role="group" aria-label="Filter contracts by what needs attention">' + triageHtml + '</div>' +
          '<div class="table-toolbar">' +
          '<div class="table-search"><i class="ph ph-magnifying-glass"></i>' +
          '<input type="search" id="dash-search" placeholder="Search contracts, vendors, or numbers" value="' + dashState.query.replace(/"/g,'&quot;') + '" /></div>' +
          '<span class="table-meta">' + rows.length + ' of ' + counts.all + ' contracts</span>' +
          '</div>' +
          '<div class="table-shell"><table class="data-table"><thead><tr>' +
          '<th class="col-flag" aria-label="Attention"></th>' +
          '<th class="sortable" data-sort="title"><span class="th-inner">Contract <i class="ph ph-' + sortIcon('title') + '"></i></span></th>' +
          '<th class="sortable" data-sort="vendor"><span class="th-inner">Vendor <i class="ph ph-' + sortIcon('vendor') + '"></i></span></th>' +
          '<th class="sortable" data-sort="category"><span class="th-inner">Category <i class="ph ph-' + sortIcon('category') + '"></i></span></th>' +
          '<th class="sortable" data-sort="stage"><span class="th-inner">Stage <i class="ph ph-' + sortIcon('stage') + '"></i></span></th>' +
          '<th class="sortable" data-sort="reviewer"><span class="th-inner">Reviewer <i class="ph ph-' + sortIcon('reviewer') + '"></i></span></th>' +
          '<th class="sortable" data-sort="value" style="text-align:right"><span class="th-inner" style="flex-direction:row-reverse">Value <i class="ph ph-' + sortIcon('value') + '"></i></span></th>' +
          '<th class="sortable" data-sort="expires"><span class="th-inner">Expires <i class="ph ph-' + sortIcon('expires') + '"></i></span></th>' +
          '<th class="sortable" data-sort="lastAction"><span class="th-inner">Last action <i class="ph ph-' + sortIcon('lastAction') + '"></i></span></th>' +
          '<th class="sortable" data-sort="nextDue"><span class="th-inner">Next due <i class="ph ph-' + sortIcon('nextDue') + '"></i></span></th>' +
          '</tr></thead><tbody>' + tbody + '</tbody></table></div>';

        // Wire interactions
        document.querySelectorAll('.triage__chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            dashState.filter = btn.dataset.filter; renderDashboard();
          });
        });
        const search = document.getElementById('dash-search');
        search.addEventListener('input', (e) => {
          dashState.query = e.target.value; renderDashboard();
          setTimeout(() => { const s = document.getElementById('dash-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 0);
        });
        document.querySelectorAll('th.sortable').forEach((th) => {
          th.addEventListener('click', () => {
            const key = th.dataset.sort;
            dashState.sort = { key, dir: dashState.sort.key === key && dashState.sort.dir === 'asc' ? 'desc' : 'asc' };
            renderDashboard();
          });
        });
      }

      /* =====================================================================
         Contract detail
         ===================================================================== */
      let detailState = {};

      function renderDetail(num) {
        const c = CONTRACTS.find((x) => x.num === num);
        if (!c) { document.getElementById('main').innerHTML = '<p>Contract not found.</p>'; return; }
        document.getElementById('page-title').textContent = c.num;

        if (!detailState[num]) {
          const d = buildDetail(c);
          detailState[num] = {
            stage: c.stage, tab: 'details',
            docs: d.documents, comments: d.comments, activity: d.activity,
            approvals: d.approvals, meetings: d.meetings,
            reviewer: { name: c.reviewer, team: c.team },
            lastActionISO: d.lastActionISO, nextDueISO: d.nextDueISO,
          };
        }
        const s = detailState[num];
        const d = buildDetail(c);
        const stage = s.stage;
        const info = STAGES[stage];
        const idx = STAGE_ORDER.indexOf(stage);
        const isException = EXCEPTION_STAGES.indexOf(stage) !== -1;
        const inReview = REVIEW_STAGES.indexOf(stage) !== -1;
        const outstanding = s.approvals.filter((a) => a.status !== 'approved').length;
        const blocked = stage === 'with_privacy' && outstanding > 0;
        const next = idx !== -1 && idx < STAGE_STEP.length - 1 ? STAGE_STEP[idx + 1] : null;

        // Stepper
        let stepperHtml = '';
        STAGE_STEP.forEach((stp, i) => {
          const state = isException ? 'todo' : (i < idx ? 'done' : i === idx ? 'current' : 'todo');
          stepperHtml += '<div class="step ' + state + '"><span class="step__circle">' +
            (state === 'done' ? '<i class="ph ph-check"></i>' : (i + 1)) +
            '</span><span class="step__label">' + stp.label + '</span></div>';
        });
        let workflowFlag = '';
        if (isException && EXC_META[stage]) {
          const m = EXC_META[stage];
          workflowFlag = '<div class="workflow-flag workflow-flag--' + m.kind + '">' +
            '<i class="ph ph-' + m.icon + '"></i><span class="workflow-flag__label">' + m.title + '</span>' +
            '<span class="workflow-flag__body">' + m.body + '</span></div>';
        }

        // Alert
        let alertHtml = '';
        if (isException && EXC_META[stage]) {
          const m = EXC_META[stage];
          alertHtml = '<div class="alert alert--' + m.severity + '"><i class="ph ph-' + m.icon + '"></i>' +
            '<div><div class="alert__title">' + m.title + '</div><div class="alert__body">' + m.body + '</div></div></div>';
        } else if (stage === 'in_process' && !s.reviewer.name) {
          alertHtml = '<div class="alert alert--warning"><i class="ph ph-warning-circle"></i>' +
            '<div><div class="alert__title">Unassigned</div><div class="alert__body">Assign a lead reviewer to begin the approval process.</div></div></div>';
        } else if (inReview) {
          const od = s.approvals.filter((a) => a.status === 'overdue').map((a) => a.team);
          if (od.length) {
            alertHtml = '<div class="alert alert--warning"><i class="ph ph-warning-circle"></i>' +
              '<div><div class="alert__title">Approval overdue</div><div class="alert__body">' +
              od.join(', ') + ' approval is overdue. Send a reminder or record their decision.</div></div></div>';
          }
        } else if (stage === 'completed' && c.expiresDays != null && c.expiresDays <= 14) {
          alertHtml = '<div class="alert alert--warning"><i class="ph ph-warning-circle"></i>' +
            '<div><div class="alert__title">Expiring soon</div><div class="alert__body">Expires in ' +
            c.expiresDays + ' days — start the renewal.</div></div></div>';
        }

        // Approvals panel
        const done = s.approvals.filter((a) => a.status === 'approved').length;
        const allDone = done === s.approvals.length;
        const APPROVAL_BADGE = {
          approved: { badge: 'live', label: 'Approved' },
          pending: { badge: 'pending', label: 'Pending' },
          overdue: { badge: 'failed', label: 'Overdue' },
        };
        let approvalsHtml = '<div class="approvals"><div class="approvals__head">' +
          '<p class="approvals__title">Attorney approvals</p>' +
          '<span class="approvals__progress">' +
          (allDone ? '<i class="ph ph-check-circle"></i>' : '') +
          done + ' of ' + s.approvals.length + ' complete</span></div>';
        s.approvals.forEach((a) => {
          const b = APPROVAL_BADGE[a.status];
          approvalsHtml += '<div class="approval">' +
            '<span class="approval__team">' + a.team + '</span>' +
            '<span class="badge badge--' + b.badge + '">' + b.label + '</span>' +
            (a.when ? '<span class="approval__meta">· ' + a.when + '</span>' : '') +
            '<span class="approval__spacer"></span>';
          if (inReview && a.status !== 'approved') {
            approvalsHtml += '<div class="approval__actions">' +
              '<button class="btn btn--secondary btn--sm" data-act="remind" data-team="' + a.team + '"><i class="ph ph-bell"></i>Send reminder</button>' +
              '<button class="btn btn--secondary btn--sm" data-act="approve" data-team="' + a.team + '"><i class="ph ph-check"></i>Record approval</button>' +
              '</div>';
          }
          approvalsHtml += '</div>';
        });
        approvalsHtml += '</div>';

        // Tabs
        const tabs = [
          { value: 'details', label: 'Details' },
          { value: 'documents', label: 'Documents (' + s.docs.length + ')' },
          { value: 'comments', label: 'Comments (' + s.comments.length + ')' },
          { value: 'notes', label: 'Notes (' + s.meetings.length + ')' },
          { value: 'activity', label: 'Activity' },
        ];
        const tabsHtml = '<div class="tabs">' + tabs.map((t) =>
          '<button class="tab' + (s.tab === t.value ? ' active' : '') + '" data-tab="' + t.value + '">' + t.label + '</button>'
        ).join('') + '</div>';

        // Tab content
        let tabContent = '';
        if (s.tab === 'details') {
          const riskHtml = d.risk ? '<div class="def def--full"><div class="def__label">Risk review</div><div class="risk-row">' +
            '<div><div class="def__label">Accesses personal data</div>' + (d.risk.personalData
              ? '<span class="yn yn--yes"><i class="ph ph-warning-circle"></i>Yes</span>'
              : '<span class="yn yn--no"><i class="ph ph-minus"></i>No</span>') + '</div>' +
            '<div><div class="def__label">Accesses PHI</div>' + (d.risk.phi
              ? '<span class="yn yn--yes"><i class="ph ph-warning-circle"></i>Yes</span>'
              : '<span class="yn yn--no"><i class="ph ph-minus"></i>No</span>') + '</div>' +
            '<div><div class="def__label">Uses AI</div>' + (d.risk.usesAI
              ? '<span class="yn yn--yes"><i class="ph ph-warning-circle"></i>Yes</span>'
              : '<span class="yn yn--no"><i class="ph ph-minus"></i>No</span>') + '</div>' +
            '</div></div>' : '';
          tabContent = '<div class="def-grid">' +
            '<div class="def"><div class="def__label">Vendor</div><div class="def__value"><button class="vendor-link" data-vendor-modal="' + c.vendor.replace(/"/g, "&quot;") + '">' + c.vendor + '<i class="ph ph-arrow-up-right"></i></button></div></div>' +
            '<div class="def"><div class="def__label">Category</div><div class="def__value">' + c.category + '</div></div>' +
            (d.risk ? '<div class="def"><div class="def__label">IT type</div><div class="def__value">' + d.risk.type + '</div></div>' : '') +
            '<div class="def"><div class="def__label">Contract value</div><div class="def__value">' + fmtUsd(c.value) + '</div></div>' +
            '<div class="def"><div class="def__label">Term</div><div class="def__value">' + d.term + '</div></div>' +
            '<div class="def"><div class="def__label">Requested by</div><div class="def__value">' + d.requester + '</div></div>' +
            '<div class="def"><div class="def__label">Request date</div><div class="def__value">' + d.requestDate + '</div></div>' +
            riskHtml +
            '<div class="def def--full"><div class="def__label">Description</div><p class="def__desc">' + d.description + '</p></div>' +
            '</div>';
        } else if (s.tab === 'documents') {
          tabContent = '<div class="section-bar"><h2>Documents</h2>' +
            '<button class="btn btn--secondary btn--sm" data-act="attach"><i class="ph ph-paperclip"></i>Attach document</button></div>' +
            '<div class="doc-list">' + s.docs.map((doc) =>
              '<div class="doc"><i class="ph ph-file-text doc__icon"></i>' +
              '<div class="doc__main"><div class="doc__name">' + doc.name + '</div>' +
              '<div class="doc__meta">Updated ' + doc.updated + ' · ' + doc.by + '</div></div>' +
              '<span class="doc__ver">' + doc.version + (doc.versions > 1 ? ' · ' + doc.versions + ' versions' : '') + '</span>' +
              '<button class="icon-btn" aria-label="Download ' + doc.name + '"><i class="ph ph-download-simple"></i></button>' +
              '</div>'
            ).join('') + '</div>';
        } else if (s.tab === 'comments') {
          tabContent = s.comments.map((m) =>
            '<div class="comment"><div class="avatar avatar--sm">' + m.author.split(' ').map((x) => x[0]).join('').slice(0,2) + '</div>' +
            '<div class="comment__body"><div class="comment__head">' +
            '<span class="comment__author">' + m.author + '</span>' +
            '<span class="comment__role">' + m.role + '</span>' +
            '<span class="comment__when">' + m.when + '</span></div>' +
            '<p class="comment__text">' + m.text + '</p></div></div>'
          ).join('') +
            '<div class="comment-form">' +
            '<textarea id="comment-input" placeholder="Add an internal note for the review team"></textarea>' +
            '<div style="display:flex;justify-content:flex-end"><button class="btn" data-act="comment-submit"><i class="ph ph-paper-plane-tilt"></i>Add comment</button></div>' +
            '</div>';
        } else if (s.tab === 'notes') {
          const NOTE_ICON = { Meeting: 'users-three', Call: 'phone', Email: 'envelope-simple', Note: 'note-pencil' };
          tabContent = '<div class="notes-list">' + (s.meetings.length === 0
            ? '<p class="notes-empty">No discussion logged yet. Record a meeting, call, or note to keep the running history on this contract.</p>'
            : s.meetings.map((m) =>
                '<div class="note"><div class="note__head">' +
                '<span class="note-type note-type--' + m.type.toLowerCase() + '"><i class="ph ph-' + (NOTE_ICON[m.type] || 'note') + '"></i>' + m.type + '</span>' +
                '<span class="note__date">' + m.date + '</span>' +
                (m.participants ? '<span class="note__people"><i class="ph ph-users"></i>' + m.participants + '</span>' : '') +
                '</div><p class="note__text">' + m.text + '</p></div>'
              ).join('')) + '</div>' +
            '<div class="note-form"><div class="section-bar"><h2>Log a discussion</h2></div>' +
            '<div class="note-form__row">' +
            '<select id="note-type"><option>Meeting</option><option>Call</option><option>Email</option><option>Note</option></select>' +
            '<input type="date" id="note-date" value="' + todayISO() + '" />' +
            '<input id="note-people" placeholder="Participants (optional)" />' +
            '</div>' +
            '<textarea id="note-text" placeholder="What was discussed, and what was decided?"></textarea>' +
            '<div style="display:flex;justify-content:flex-end"><button class="btn" data-act="note-submit"><i class="ph ph-plus"></i>Add note</button></div>' +
            '</div>';
        } else if (s.tab === 'activity') {
          tabContent = '<div class="timeline">' + s.activity.map((a) =>
            '<div class="tl"><span class="tl__icon"><i class="ph ph-' + a.icon + '"></i></span>' +
            '<div class="tl__main"><div class="tl__text">' + a.text + '</div><div class="tl__when">' + a.when + '</div></div></div>'
          ).join('') + '</div>';
        }

        // Right rail
        const dueDays = s.nextDueISO ? daysFromToday(s.nextDueISO) : null;
        const dueClosed = ['canceled','terminated','completed'].indexOf(stage) !== -1;
        const dueOverdue = dueDays != null && dueDays < 0 && !dueClosed;
        const dueRel = dueDays == null ? null
          : dueDays < 0 ? (-dueDays) + (dueDays === -1 ? ' day' : ' days') + ' overdue'
          : dueDays === 0 ? 'Due today'
          : 'in ' + dueDays + (dueDays === 1 ? ' day' : ' days');

        const statusOptions = Object.keys(STAGES).map((id) =>
          '<option value="' + id + '"' + (id === stage ? ' selected' : '') + '>' + STAGES[id].label + '</option>'
        ).join('');

        let primaryBtn;
        if (stage === 'completed' || stage === 'expired') {
          primaryBtn = '<button class="btn btn--secondary" data-act="renew"><i class="ph ph-arrows-clockwise"></i>Start renewal</button>';
        } else if (stage === 'on_hold') {
          primaryBtn = '<button class="btn" data-act="resume"><i class="ph ph-play"></i>Resume review</button>';
        } else if (stage === 'canceled' || stage === 'terminated') {
          primaryBtn = '<button class="btn btn--secondary" data-act="reopen"><i class="ph ph-arrow-counter-clockwise"></i>Reopen contract</button>';
        } else {
          const lbl = next && next.id === 'completed' ? 'Mark completed' : 'Advance to ' + next.label;
          primaryBtn = '<button class="btn" data-act="advance"' + (blocked ? ' disabled' : '') + '><i class="ph ph-arrow-right"></i>' + lbl + '</button>' +
            (blocked ? '<span class="advance-hint">' + outstanding + ' approval' + (outstanding === 1 ? '' : 's') + ' outstanding</span>' : '');
        }

        const railHtml = '<aside class="rail">' +
          '<div class="rail-card">' +
          '<p class="rail-card__eyebrow">Status</p>' +
          '<div class="status-now"><span class="badge badge--' + info.badge + '">' + info.label + '</span></div>' +
          '<select id="status-select">' + statusOptions + '</select>' +
          '<p class="status-hint">Set any of the 13 contract statuses. Each change is recorded in the activity trail.</p>' +
          '</div>' +
          '<div class="rail-card">' +
          '<p class="rail-card__eyebrow">Action dates</p>' +
          '<div class="facts">' +
          '<div class="fact"><span class="fact__k">Last action</span><span class="fact__v">' + fmtLong(s.lastActionISO) + '</span></div>' +
          '<div class="fact"><span class="fact__k">Next action due</span>' +
          '<span class="fact__v' + (dueOverdue ? ' fact__v--overdue' : '') + '">' +
          (dueOverdue ? '<i class="ph ph-warning-circle"></i>' : '') + fmtLong(s.nextDueISO) + '</span></div>' +
          '</div>' +
          (dueRel ? '<div class="due-rel' + (dueOverdue ? ' due-rel--overdue' : '') + '">' + dueRel + '</div>' : '') +
          '</div>' +
          '<div class="rail-card">' +
          '<p class="rail-card__eyebrow">Lead reviewer</p>' +
          '<div class="reviewer-block">' +
          (s.reviewer.name
            ? '<div class="avatar avatar--sm">' + s.reviewer.name.split(' ').map((x) => x[0]).join('').slice(0,2) + '</div>'
            : '<div class="avatar avatar--sm"><i class="ph ph-user"></i></div>') +
          '<div><div class="reviewer-block__name">' + (s.reviewer.name || 'Unassigned') + '</div>' +
          '<div class="reviewer-block__team">' + (s.reviewer.team || 'No team') + '</div></div>' +
          '</div>' +
          '<button class="btn btn--secondary btn--sm" data-act="reassign"><i class="ph ph-user-switch"></i>' +

              s.stage = next.id;
              s.activity.unshift({ icon: 'arrow-right', text: 'Status changed to ' + STAGES[next.id].label, when: 'Just now' });

              const team = btn.dataset.team;
              s.approvals = s.approvals.map((a) => a.team === team ? Object.assign({}, a, { status: 'approved', when: 'Just now' }) : a);
              s.activity.unshift({ icon: 'check-circle', text: team + ' approval recorded', when: 'Just now' });
              showToast(team + ' approval recorded.'); renderDetail(num);

              const team = btn.dataset.team;
              s.activity.unshift({ icon: 'bell', text: 'Reminder sent to ' + team, when: 'Just now' });

              const opts = REVIEWERS.map((r) => r.name + ' · ' + r.team).join('\n');

                if (r) {
                  s.reviewer = { name: r.name, team: r.team };
                  s.activity.unshift({ icon: 'identification-badge', text: 'Reassigned to ' + r.name + ' · ' + r.team, when: 'Just now' });
                  showToast('Reassigned to ' + r.name + '.'); renderDetail(num);
                }
              }
            } else if (act === 'attach') {
              s.docs.unshift({ name: 'New attachment', version: 'v1', versions: 1, updated: 'Today', by: 'Lisa Farkas' });
              s.activity.unshift({ icon: 'paperclip', text: 'Document uploaded: New attachment v1', when: 'Just now' });
              showToast('Document attached.'); renderDetail(num);
            } else if (act === 'comment-submit') {
              const t = document.getElementById('comment-input').value.trim();
              if (t) {
                s.comments.push({ author: 'Lisa Farkas', role: 'Procurement', when: 'Just now', text: t });
                s.activity.unshift({ icon: 'chat-text', text: 'Comment added by Lisa Farkas', when: 'Just now' });
                showToast('Comment added.'); renderDetail(num);
              }
            } else if (act === 'note-submit') {
              const type = document.getElementById('note-type').value;
              const date = document.getElementById('note-date').value;
              const people = document.getElementById('note-people').value.trim();
              const text = document.getElementById('note-text').value.trim();

                s.meetings.unshift({ type, date: fmtLong(date), participants: people, text });
                s.activity.unshift({ icon: 'notepad', text: type + ' note logged', when: 'Just now' });
                showToast(type + ' note logged.'); renderDetail(num);
              }
            }
          });
        });
